 const sv=RG.saved(),me=AU&&AU.name,nm=me||lastName||'',ti=curTitle(),d=dayN(),dt=!!(sv&&sv.dly===d),dd=dlyDone(d)&&!dt,nw=store.get('seenLog','')!==LOG[0].v,bl=sv?[...sv.ch,...(sv.or||[])].filter(c=>CH[c.id]).slice(0,8):[];

 const gap=w/11;for(let l=0;l<11;l++){drawFruit(c,gap*(l+.5),22,Math.min(gap*.48,7+l*1.4),l);if(nums)T(c,String(l+1),gap*(l+.5),51,12,'#c9b8dc');}}
/* What's new: newest first. v = version shown, d = date, t = title, i = lines. Add an entry with every change players will notice. The menu marks it New until opened (store key seenLog = newest v) */
const LOG=[
 {v:'1.72.3',d:'22 Nov 2026',t:'Fusion badge',i:['The F is a button again: tap it for the fusion. Shop and crate rows no longer open up when tapped.']},
 {v:'1.72.2',d:'22 Nov 2026',t:'Fusion badge',i:['The fusion F has new pixel art and animates when you hold the other half.','Tap the item itself to see its fusion under its description: a shop or crate row opens below, and your own items show it on their card. No more aiming for the tiny F.']},
 {v:'1.72.1',d:'21 Nov 2026',t:'Fusion badge',i:['Items that are half of a fusion you have found carry a red F, in the shop, in crates and on your own items. It lights up when you already hold the other half. Tap the F to see the recipe.']},
 {v:'1.72',d:'21 Nov 2026',t:'Shot called',i:['A Slingshot shot that earns a bonus now pops up a big Trick Shot! or Pinball! with the Mult it gave (Trick Shot, Hibachi, Pinball). Ricochet shows +0.2 Mult at each wall bounce.']},
 {v:'1.71.1',d:'21 Nov 2026',t:'Bigger intro',i:['The opening logo now fills the width of the screen.']},
 {v:'1.71',d:'21 Nov 2026',t:'New logo',i:['Overripe has a pixel art logo at the top of the screen, and opening the game plays a short intro of it. Tap to skip it.']},
 {v:'1.70',d:'21 Nov 2026',t:'Pixel shine',i:['Tools with an edition (Candied, Juiced, Ambrosia) look calmer on the tool bar: a thin pixel frame and a small blinking pixel sparkle instead of a glow.']},
 {v:'1.69',d:'20 Nov 2026',t:'Sky high',i:['A fruit fired upwards with the Slingshot no longer hits an invisible roof. It flies off the top of the screen and falls back, and an arrow at the top shows where it is.']},
 {v:'1.68',d:'20 Nov 2026',t:'Hibachi',i:['A new tool fusion to discover in Slingshot runs. Look for it in the Almanac once you find it.','With the Slingshot on, a fast knife swipe that misses no longer throws your fruit.']},
 {v:'1.67',d:'20 Nov 2026',t:'Two slices',i:['A full Paring Knife now gives 2 swipes. A fast swipe that misses uses one, so you get a second try at the same fruit. The button shows how many are left, and the knife refills once both are used.']},
 {v:'1.66',d:'20 Nov 2026',t:'Slice it',i:['The Paring Knife is now a swipe: tap it to ready the knife, then swipe through a falling or flying fruit to cut it in two. One swipe can cut every falling fruit it crosses. A tap still drops your fruit, and a fast swipe that misses does not drop.']},
 {v:'1.65',d:'20 Nov 2026',t:'Rock on',i:['Three new awards for rock builds: win holding 5 rock items (Rock Garden, Gargoyle, Pebble Polish, Geode, Petrify, Shatter and their fusions). You Rock! opens the Cobblestone jar, Rock and/or Roll! (Ripeness 4) the Rock Concert background, and Rock and Roll Hall of Fame, you! (Ripeness 8) the animated Rock Star profile picture and the Legendary title Rock Star.']},
 {v:'1.64',d:'20 Nov 2026',t:'Best score',i:['The trophy at the top now says what its number is: your best score in the mode you are in (Rogue on the menu). Big scores are shortened, like 9.6m. Tap it for that mode\'s leaderboard.','Cleaner icons on the menu tiles.','Profile is tidier: your card with an Edit button. In Edit, tap your picture, title or stats to change them.']},
 {v:'1.63',d:'20 Nov 2026',t:'New name',i:['Fruit Merge is now called Overripe. Your scores, runs and progress are unchanged.']},
 {v:'1.62',d:'20 Nov 2026',t:'Back arrow',i:['Every menu has a back arrow in the top right that stays in view while you scroll, so you no longer have to scroll down to Back.']},
 {v:'1.61',d:'20 Nov 2026',t:'New menu',i:['A new main menu with Rogue first: continue your run or start one, the Daily run under it, then Almanac, Scores, Looks and What\'s new. Classic and Wild are under More modes.','Profile is now where you change how you look to others: profile picture, title, the stats you show and your account. Guests can open it too.','Options only holds game settings now. Looks has its own button on the menu.','How to play moved off the menu to its own screen.']},
 {v:'1.60',d:'20 Nov 2026',t:'Profile pictures',i:['Profile pictures: 11 to earn from awards, 7 of them animated. Pick one in Options, Looks. Friends see it on your profile card and in their friends list.','Teppanyaki now also gives the Oni Mask.','Fixed: leaving the Friends tab between jars no longer drops you at the bottom of the shop.']},
 {v:'1.59',d:'20 Nov 2026',t:'Paring Knife',i:['Rogue: a new tool, the Paring Knife. Use it while a fruit is falling or flying and it splits into two fruit one size smaller. A half that merges with another fruit before your next drop scores ×3.','A new award, Teppanyaki: win a run holding the Paring Knife and the Slingshot. It opens two new looks, the Great Wave background and the Oni jar.']},
 {v:'1.58.3',d:'20 Nov 2026',t:'Fusion pieces',i:['Rogue: a piece of a fusion you made can turn up again if it would make another fusion with something you hold. Lucky Clover after Four-Leaf Clover, for example, comes back while you hold Double or Nothing.']},
 {v:'1.58.2',d:'20 Nov 2026',t:'Fusion pieces',i:['Rogue: once you make a fusion, its two pieces are no longer offered in the shop or in crates, so you can not hold a piece twice.']},
 {v:'1.58.1',d:'20 Nov 2026',t:'Vibration strength',i:['Vibration has a strength: Off, Light, Normal or Strong. Tap the Vibration button in Options to change it. On iPhone it stays a single light tick.','A short buzz when you buy, take or sell an item.','Rogue: the i button between jars now has tabs too: Run info, Friends, Almanac and Options.']},
 {v:'1.58',d:'20 Nov 2026',t:'Vibration',i:['Your phone vibrates when things happen: merges (stronger for bigger fruit), crates shaking and bursting open, explosions, shakes, rare finds and game over.','Switch it off in Options or on the pause screen. Works on Android. iPhones only allow a light tick, on iOS 18 or later.']},
 {v:'1.57.4',d:'20 Nov 2026',t:'Player cards',i:['A player\'s card no longer runs off the bottom of the screen. It moves to fit once their run loads, and scrolls if it is taller than the screen.']},
 {v:'1.57.3',d:'20 Nov 2026',t:'Friends in Rogue',i:['Rogue: a Friends tab on the i screen, and a Friends button on Run info between jars. See who is online and the run each friend is on.','Tap any of a friend\'s items for its full card: rarity, edition, what it does and how far it has grown.']},
 {v:'1.57.2',d:'20 Nov 2026',t:'Profile button',i:['A big Profile button on the main menu opens your profile straight away, no trip through Options.','Your profile has two tabs: Profile and Friends. Friends has your friends list, requests, Add friend and the Inbox.']},
 {v:'1.57.1',d:'20 Nov 2026',t:'Friends fix',i:['Accepting a friend request, removing a friend and cancelling a request work now. They failed with "Failed to fetch".']},
 {v:'1.57',d:'20 Nov 2026',t:'Inbox and online friends',i:['New Inbox (menu, Options and Profile): friend requests to accept, requests you sent with a Cancel button, and a note when someone accepts yours. A red number shows when something is waiting.','Friends show a green dot when they are online, what they are playing, or when they were last seen.','Tap a player to see their Rogue run in progress: jar, Ripeness, depth, score and items. Tap an item to see what it does.']},
 {v:'1.56',d:'20 Nov 2026',t:'Watermelon harvest',i:['Rogue: a Watermelon you make now scores, then is harvested a second later and leaves the jar. It no longer sits there for the rest of the depth.','The Melon Queen\'s Watermelon still stays.','Double Melon: make 2 Watermelons in one jar.']},
 {v:'1.55.4',d:'20 Nov 2026',t:'New run screen',i:['The starting jars sit four to a row, so all eleven fit and Ripeness and Start are back in view.']},
 {v:'1.55.3',d:'20 Nov 2026',t:'Throwing items',i:['Slingshot: the dotted path now stops at the first wall the fruit will hit.','Lob: Slingshot throws are 30% faster (it used to throw higher, which the new Slingshot does by itself). Catapult gets the same.','Ricochet: up to +3 Mult a jar.']},
 {v:'1.55.2',d:'20 Nov 2026',t:'Slingshot',i:['The Slingshot now works like one: press, pull back and let go. The fruit flies the other way, faster the further you pull.','A band shows how far you are pulling, green to red, and dots show where the fruit will go, bounces off the walls included.']},
 {v:'1.55.1',d:'20 Nov 2026',t:'Tool editions',i:['Candied, Juiced and Ambrosia tools now show it on the tool bar: a pink, purple or gold outline with the same shine as on their card.']},
 {v:'1.55',d:'20 Nov 2026',t:'Five new jars',i:['Seesaw Jar: the jar leans towards its heavier side and the fruit slide that way. Keep it level for ×1.5 merges.','Clockwork Jar: no drop count, a clock instead, and the fruit drops by itself after 2 seconds.','Giant Jar: only Grapes, Lemons and Oranges drop, into a wider jar, against higher targets.','Moon Jar: half gravity and bouncier fruit. You start with the Slingshot.','Hourglass Jar: the walls pinch in halfway down, and a Pineapple or bigger gets stuck above the neck.','Each one is opened by a new award, with a title.']},
 {v:'1.54',d:'20 Nov 2026',t:'New run screen',i:['The New run screen has three tabs: Your run, Daily run and Profile.','Your run: the starting jars are a grid, each with 8 pips for the Ripeness you have won with it. Tap a locked jar to see the award that opens it. Ripeness has ◀ ▶ buttons and says what that level adds. Start run stays at the bottom of the screen.','Daily run: today\'s jar and Ripeness, the time to the next one and today\'s top 3.','Profile: your stats and your friends list, without going through Options.']},
 {v:'1.53.1',d:'20 Nov 2026',t:'Daily run box',i:['The daily run now sits under Start run on the New run screen, in its own blue box.']},
 {v:'1.53',d:'20 Nov 2026',t:'Daily runs and friends',i:['Daily run: one Rogue run a day that is the same for everyone. Same jar, Ripeness, bosses, shops, crates and fruit order, with every item open. One attempt, and its own board that starts fresh every day at 00:00 UTC. Find it on the New run screen.','Profiles: signed-in players have a profile with three stats of their choice, like favourite fruit, best score or biggest merge. Open it from Options.','Friends: send a friend request by username, or tap a name on a board to see that player\'s profile and add them.','The boards have a Friends tab, and after a game you can switch between the world board and your friends.']},
 {v:'1.52',d:'19 Nov 2026',t:'Codes',i:['Options has a Redeem code box. Some codes give a title, and each code only works a limited number of times, so be quick. You need to be signed in.']},
 {v:'1.51.2',d:'19 Nov 2026',t:'Shiny titles',i:['Epic titles glow purple and Legendary titles shimmer in rainbow colours, on the score boards and the Titles screen.']},
 {v:'1.51.1',d:'19 Nov 2026',t:'Run info anywhere',i:['The i button at the bottom right now opens Run info between jars too: on the hub, the shop, crates, skips and the Jar cleared screen. Close it and you are back where you were.','The shop no longer has its own Run info button, the i button does it.','The score table in Run info shows how many of each fruit you have made this run.']},
 {v:'1.51',d:'19 Nov 2026',t:'Retry',i:['Lost? A Retry button on the game over screen starts again at once. In Rogue it starts a new run with the same jar and Ripeness.','The Collector: when you reach the target without the fruit it asks for, the jar now says so, and the score bar turns orange until you make it.']},
 {v:'1.50',d:'18 Nov 2026',t:'The long haul',i:['29 new awards for the long haul: wins, losses, runs, merges, Watermelons, gold merges, crates, pets fed, fruit destroyed, fusions and bosses beaten, counted over all your runs. Each one gives a title, up to Legendary.','What you did before this update counts. The Almanac and the Titles screen show how far along each one is.','They do not count towards filling the Almanac.']},
 {v:'1.49',d:'18 Nov 2026',t:'Titles',i:['75 more titles: every Rogue award now gives one, from Common to Legendary.','Titles have their own screen: scroll through them all, see what each one asks and how rare it is, and tap one to wear it. Open it from Options.','At the end of a Rogue run you can change your title before your score goes on the board.']},
 {v:'1.48',d:'18 Nov 2026',t:'Ambrosia',i:['A new edition above Juiced: Ambrosia items give ×1.5 Mult. They glow gold and turn up very rarely, on 0.3% of shop and crate offers, for 5 coins more.']},
 {v:'1.47.2',d:'18 Nov 2026',t:'Rarer editions',i:['Candied and Juiced items turn up less often: Candied on 2% of offers (was 4%), Juiced on 0.8% (was 2%). With 8 items in each shop they were showing up every couple of shops.']},
 {v:'1.47.1',d:'18 Nov 2026',t:'Pet XP bars',i:['Pets show an XP bar under their level, on the top bar and in the hub and shop. It fills as they work and as you clear jars, and turns gold at level 5.','Sinkhole: the Heavy fruit shows its lead rim while you hold it, not only once it drops.','Score boards shorten big scores: 1.4m, 655.4m. Tap and hold a score to see it in full.','Candied items give +10 points on every merge (was +15).']},
 {v:'1.47',d:'18 Nov 2026',t:'The Orchard grows',i:['20 new Orchard items, most of them Uncommon: Maple Tap, Sugar Maple, Cherry Orchard, Mushroom Ring, Frost Pocket, Wind Sock, Grafting Vine, Gunpowder Tree, Treat Tree, Double Blossom, Spark Bush, Money Tree, Volunteer Seedlings, Termite Mound, Tropical Breeze, Firefly Glade, Sinkhole, Seed Rain, and the Rare Gourd Vine and Golden Apple Tree.','New fruit to look out for: Candied (+40 points when it merges), Treats (your pets eat them first and level up), Charged (tools gain charge), coin fruit, Brittle (crumbles after 6 seconds) and Glowing (always keeps a combo going).','The shop leans towards Uncommon Orchard items now. Double or Nothing and All In can never be a sure thing, even with Horseshoe.']},
 {v:'1.46',d:'18 Nov 2026',t:'Seeds, tools and rocks',i:['Seeds: Compost Bin, Harvest Moon, Seed Bank. Tools: Jump Start, Tremor, Recycler, Toolsmith. Position and rocks: Floor Show, Balcony, Pebble Polish, Centre Stage, Geode. Coins and luck: Tip Jar, Loose Change, Compound Interest, Double or Nothing. Throwing: Lob.','Seven new fusions to find among them, one of them with Lucky Clover and one with Curveball.']},
 {v:'1.45',d:'18 Nov 2026',t:'Small, big and combo',i:['Small fruit: Pip Squeak, Golden Berry, Kindling, Nursery. Big fruit: Big Break, Ballast, Skyline, Landslide. Combos: Finisher, Rapid Fire, Domino, Drumroll. Gold: Pay Dirt, Gold Plating, Gold Standard.','Seven new fusions to find among them, one of them with Crescendo and one with Bloom Bomb.','11 new awards, and some of the new items are now locked behind them: clear a jar with a pet, raise a Caterpillar to level 5, hold 4 level 5 pets, keep a fruit gold through 6 merges, and more. Open the Almanac\'s Awards tab to see what each one opens.']},
 {v:'1.44',d:'18 Nov 2026',t:'Wildcards',i:['Wildcards: a new kind of fruit with a rainbow ring. It merges with a fruit of any size and makes one size up from the bigger of the two, for half the points. Get them from Joker Seed, then Wild Card and Masquerade.','Family charms: Citrus Squeeze, Tropical Punch, Berry Bowl, Fruit Salad and Orchardist.','Boss counters: Blue Cheese lets mouldy fruit merge, Ice Sculptor pays for fruit that were frozen, Sweet Tooth pays for Sticky fruit.','Four new fusions to find among them.','The Rogue start screen shows each mechanic as a tile. Tap one to read how it works.']},
 {v:'1.43',d:'18 Nov 2026',t:'Juiced and Candied',i:['Items can now come Juiced (rainbow shimmer, +1.5 Mult) or Candied (sugar glaze, +15 points on every merge). Any charm, Orchard item or tool in the shop or a crate can roll one. They cost a little more and sell for more.','The shop shows 5 charms instead of 3. Rare charms are rarer per slot, so you see about as many as before.','Crates bought in the shop now offer a fusion you are ready for as their first pick: the Charm Crate a charm fusion, the Tool Crate a tool fusion, the Seed Crate one with a seed half.','Pets level up, from 1 to 5, with a Level Up! when they do. They gain XP for every jar you clear while you hold them and as they work. Each level makes them act more often, eat bigger fruit and score more, and a level 5 pet also gives ×1.25 Mult. Fusions keep the level. The green number on a pet shows its level.','13 new charms for pets and Boom fruit. Pets: Pet Collar, Doggy Bag, Pollen Count, Truffle Hunt, Well Fed, Pack Leader, Cross-Pollination. Bombs: Short Fuse, Shrapnel, Demolition, Zest Bomb, Bloom Bomb, Chain Blast. Four new fusions to find among them.']},
 {v:'1.42',d:'18 Nov 2026',t:'Limbo',i:['New rare charm, Limbo: ×3 Mult, but the line sits lower, by 25% of the jar. Less room, much bigger merges.']},
 {v:'1.41.2',d:'18 Nov 2026',t:'Map, wording and fixes',i:['Clearer descriptions on about 60 items. Charms that multiply your Mult now say ×Mult, combos and destroyed fruit are explained where they are used, and bosses like The Rot, The Lid and Cold Snap give their numbers.','The Map of the run is redrawn: each depth is a card with its jars on a path, you are marked, and past depths fold away.','You can skip the jar you are on from the Map: pick the wooden crate or the reward, then tap again to skip.','Moving a charm with ◀ ▶ from the top bar keeps its card next to it, instead of jumping to the top of the screen.']},
 {v:'1.41.1',d:'18 Nov 2026',t:'Run over',i:['The Run over screen lists your run: jars cleared, merges, favourite merge, biggest fruit, best merge, best Mult, best combo, favourite tool and more.','The build under Beaten by wraps into rows instead of running off the screen.']},
 {v:'1.41',d:'18 Nov 2026',t:'Legendaries',i:['Four new Legendary charms you use yourself: tap one in a jar, then Use. Golden Rain (10 charge): every fruit turns gold, at ×3 and 4 coins. Supernova (8): every pair merges at once, those merges ×10. Limelight (10): your next 8 merges ×4. Passerby (6): a Russian Blue cat carries your next 6 fruit to a match, and those drops are free. They charge 1 per merge.','Phoenix takes no slot, its cleared fruit score ×2 and it gains ×0.5 each time it saves you. Cornucopia adds ×1.5. Heirloom starts at ×1.25 and gains ×0.1 a jar. Stowaway is ×1.75, adds an Orchard slot and scores your rightmost other charm twice. White Flag also stops curses, lowers boss targets by 10% and gains ×0.08 per boss.','Legendaries turn up twice as often in Charm Crates and sell for their full 15.','The Auditor no longer caps Mult: above ×6 it counts half (a quarter above ×4 in phase 2). The cap ended big runs on the spot.']},
 {v:'1.40.2',d:'18 Nov 2026',t:'Run info',i:['The shop has a Run info button.','Run info\'s sections fold up like the shop\'s: tap a heading to open or close it. A closed one shows what is inside, and the Seeds heading shows how many sizes and levels you hold.']},
 {v:'1.40.1',d:'18 Nov 2026',t:'Balance',i:['Vintage gains +0.08 Mult per jar cleared (was +0.4), Snowball ×0.04 (was ×0.1), Keepsake +0.04 per small fruit and +0.12 per jar (was +0.05 and +0.6). Found early, each of them won most runs on its own.','Run info: the score table no longer rolls Lucky Clover, Snake Eyes and Four-Leaf Clover, so it shows your build before chances, as it says.']},
 {v:'1.40',d:'17 Nov 2026',t:'Nine charms, two tools',i:['New charms: Crescendo (the 2nd merge of a combo and every one after it ×2), Bonfire (after a fruit is destroyed, your next 3 merges ×2), Polyculture (×0.1 Mult for every fruit size you hold a seed for), Hallmark (×0.5 Mult for every gold fruit merged this jar, up to ×3).','Five more are opened by new awards: Stage Fright (×2 while every tool is fully charged), Big Spender (×0.1 for every 2 coins spent in the last shop, up to ×2), Rabbit\'s Foot (+0.15 Mult every time a chance charm misses), Brinkmanship (merges made over the line ×3) and Family Tree (a seed gives half its bonus to the other fruit of its family).','New tools: Shears (a fruit shrinks one size) and Harvest (every fruit over the line is removed and scores its size\'s points).','Headliner gives +0.5 Mult per tool use (was +1). Sleight of Hand needs 2 charge (was 1).','The Collector asks for one size smaller when you hold Bite Size or Snack Pack: an Apple (6), then a Pear (7).','Long Arm is no longer switched on and off: charge it, tap it, and your next 3 drops fall from where you tap in the jar.','The shop\'s sections fold up: tap a heading to open or close it. A closed one shows what is on sale. Charms start open.']},
 {v:'1.39',d:'17 Nov 2026',t:'Fixes and run summaries',i:['Fixed: Sleight of Hand and Juggler could recharge two tools for ever and clear a jar with no drops. A tool now hands charge to your other tools once per drop.','The Orchard Queen now gets the lower target of the bosses she brings (The Auditor, The Swarm, The Leech), and The Swarm no longer comes with The Pruner or The Collector.','Fat Wallet stops at +4 Mult. Slow Cook stops at +2.','Sweet Spot: every 5th merge scores ×5 (was every 7th). Old Oak gains ×0.06 (was ×0.04).','New in Options: Run summaries. Switch it on and each Rogue run sends where it ended, what beat it and your build, to help balance the game.']},
 {v:'1.38',d:'16 Nov 2026',t:'Map',i:['The hub and the shop have a Map of the run: every depth with its targets, what skipping jar 1 or 2 gives, the mini boss, and each boss with its curses and crate. Skip rewards are now known ahead, and the Skip button says what you get.']},
 {v:'1.37.2',d:'16 Nov 2026',t:'Beaten by',i:['The Rogue screen has New run and Continue at the top.','When a run ends, the Run over screen shows what beat you: the boss or jar, its rules, its curses, how close you got to the target and the build you had.','The Swarm and The Gambler pick the fruit sizes themselves, so Orchard items that change sizes (Citrus Grove, Berry Patch, Weeding and the like) do nothing on their jars. Those items now show as greyed out there, and the boss text says so.']},
 {v:'1.37.1',d:'16 Nov 2026',t:'Gentler curses',i:['The drop curses were far too harsh. Blight now turns every 3rd Cherry, Strawberry or Grape (one of them) into a rock. Worms: every 12th drop. Frost: every 4th drop freezes where it lands for 3 seconds, instead of freezing the fruit around it.','Tap the curse icons at the top left (or the boss) to read the boss and its curses.','The Rogue intro screen covers the Orchard, families, curses, switch tools and the i button.']},
 {v:'1.37',d:'16 Nov 2026',t:'Cursed bosses',i:['Every boss now brings two curses. One works on your drops from the start: Blight, Overgrowth, Worms, Frost or Bramble. The other hits your Orchard at phase 2: Uproot, Pest or Sour Graft, which makes your Orchard items work backwards. They show next to the boss icon.','The hub and shop show the next depth\'s boss and its curses, so you can get ready.','New upgrades: Hardy (no Orchard curses) and Pesticide (no mould). New skip reward Detour draws this depth\'s boss again. Drop curses can turn up as contracts.','Run info has a score table: what each fruit size is worth with your build right now.']},
 {v:'1.36',d:'16 Nov 2026',t:'Throws, bounces and switches',i:['Slingshot is now a tool you switch on and off. While it is on, each drop costs 1 charge. A saved run turns it into the tool.','Two new kinds of tool: switches (Slingshot, Moon Boots, Long Arm) stay on until you switch them off or the charge runs out, and several can run at once. Timed tools (Tilt, Twin Drop) last a number of drops.','New charms: Ricochet, Curveball, Pinball (for thrown fruit), Quick Hands, Slow Cook and Lingering.','New Orchard item Rubber Tree: every 5th fruit is bouncy.','Lead Weight can now target the fruit you hold, so it drops heavy.']},
 {v:'1.35',d:'16 Nov 2026',t:'Fusions are easier to find',i:['While you hold one half of a fusion, the other half turns up more often in the shop and in crates, a little more for every shop that misses it.','New charm Grafter: +2 Mult for every fusion you hold.','New charm Rootstock: making a fusion gives a random seed 2 levels.']},
 {v:'1.34',d:'16 Nov 2026',t:'Families and the Orchard',i:['Every fruit belongs to a family: Stone fruit (Cherry, Peach), Berries (Strawberry, Grape), Citrus (Lemon, Orange), Pome (Apple, Pear), Tropical (Pineapple) and Melons. A family merge is two fruit of that family merging. The Almanac lists them.','New: the Orchard, a row of 2 slots at the top right with a green border. Orchard items only change what drops. The shop sells one each visit and crates sometimes hold one. The Raised Bed upgrade gives a 3rd slot.','Lodestone, Rich Soil and Prospector moved to the Orchard. A saved run moves them for you.','12 new Orchard items (Forecast shows the fruit coming after Next), 6 charms that score families, and 5 new fusions.']},
 {v:'1.33',d:'16 Nov 2026',t:'New jar layout',i:['Pause and Run info are now one i button, next to the drops bar. It opens Run info, the Almanac and Options as tabs, with Resume and Quit run at the bottom.','The drops bar sits just above your tools. The jar moved up into its old space and kept its size.','Your score is in the middle, with the last merge and the boss hint under it. Mult is top right above Next. Depth, boss and the boss button are top left.']},
 {v:'1.32.4',d:'14 Nov 2026',t:'Volume and Run info',i:['The sound button is now a volume slider, in Options and on the pause screen.','Rogue: an i button next to pause opens Run info. Closing it goes straight back to the jar.']},
 {v:'1.32.3',d:'14 Nov 2026',t:'Text size',i:['Options and the pause screen have a Text size button: Small, Normal or Large. It changes the menus and the cards, not the jar.','Small fits more on a small phone.']},
 {v:'1.32.2',d:'14 Nov 2026',t:'Fix',i:['The biggest fruit is the Watermelon (11) again. The Queen is the boss.']},
 {v:'1.32.1',d:'14 Nov 2026',t:'Long live the Queen',i:['The Melon King is now The Melon Queen.']},
 {v:'1.32',d:'14 Nov 2026',t:'A fairer Melon King',i:['The Melon King\'s watermelon never counts as over the line. On a part-full jar it used to end the run seconds after it landed.','A new tool in the shop.']},
 {v:'1.31.1',d:'14 Nov 2026',t:'Upgrade tuning',i:['Five of the new upgrades were weaker than the old ones in testing. They are stronger or cheaper now.']},
 {v:'1.31',d:'14 Nov 2026',t:'More upgrades',i:['10 new upgrades in the shop.','The Watermelon (11) has a new look.','The Mandarin (4) is now the Lemon (4).']},
 {v:'1.30.3',d:'14 Nov 2026',t:'Fewer upgrades on the shelf',i:['The shop offers 2 upgrades (was 3). A new upgrade adds the third back.','Good Taste shifts the shop half as far: Rare charms are 7 in 100 at one level and 10 in 100 at two (was 10 and 16).','Good Taste is now an Uncommon upgrade: the shop offers it less than half as often.']},
 {v:'1.30.2',d:'14 Nov 2026',t:'Crate opening',i:['The picks stay hidden while a crate opens, then pop in.']},
 {v:'1.30.1',d:'14 Nov 2026',t:'Where a look came from',i:['Every unlocked look now says which award earned it and what you did, in the Looks screen and the Almanac.']},
 {v:'1.30',d:'14 Nov 2026',t:'Looks that move',i:['The six hardest looks to earn are now animated.','If your device is set to reduce motion, looks hold still.']},
 {v:'1.29',d:'14 Nov 2026',t:'Legendary charms',i:['5 Legendary charms, the rarest charms in the game.','They are never sold. A charm in a Charm Crate you buy has a 2 in 100 chance to be Legendary, a charm in a melon crate 5 in 100.','The shop\'s crate is now at the top of the shop, and each kind has its own colour: purple for charms, blue for tools, green for seeds.','A new award.']},
 {v:'1.28',d:'14 Nov 2026',t:'Contracts and skip rewards',i:['Contracts: from depth 2, every plain jar offers one. It is a rule that makes the jar harder, like 6 fewer drops or locked tools. Sign it on the jar screen or in the shop, clear the jar and it pays coins, a seed level or a crate. You never have to sign.','Skipping a jar now gives a pick of two rewards: the wooden crate, or one of Free Rolls, Double Pay, Bigger Haul or Extra Drops.','2 new awards for contracts. A run saved before this update still loads.']},
 {v:'1.27',d:'14 Nov 2026',t:'Looks',i:['Looks: 8 jar skins, 7 backgrounds, 3 fruit skins and 3 sound sets. Wear them from Options. They change nothing about how the game plays.','19 new Rogue awards open them. Some older awards now open a look too.','Awards that count over all your runs include what you did before this update. Start a run to collect them.','Almanac: earned awards get a stamp with the date, and a bar shows how much of the Almanac you have filled. Filling it earns two awards of its own.']},
 {v:'1.26',d:'13 Nov 2026',t:'Pets and pollen',i:['New app icon: the apple.','A new charm for small fruit builds.','Pets no longer eat pollinated fruit, so your Busy Bee\'s ×3 is not wasted.','A new fusion.']},
 {v:'1.25',d:'13 Nov 2026',t:'Almanac in the shop',i:['Busy Bee: its target fruit is ringed as soon as the bee appears. If that fruit merges first, the bee goes to the nearest fruit instead of flying off.','The shop and the jar screen between rounds have an Almanac button. Check a fusion recipe you have found before without leaving the shop.']},
 {v:'1.24',d:'13 Nov 2026',t:'Crates',i:['Crates now shake and burst open before showing what is inside. Tap to skip.','Boss crates offer fewer rare charms: gold crates 10 in 100 (was 15), melon crates 30 in 100 (was 70). Melon crates still never offer common charms.']},
 {v:'1.23',d:'13 Nov 2026',t:'Seeds cut back',i:['Seeds were far stronger than anything else in the shop. Each level now gives +0.25 Mult (was +0.5), and a seed costs 2 coins more for every level you hold of it (was 1). The points are unchanged.','Smoothie: +1.5 Mult and +12 points a merge (was +2 and +20).','Marathon: ×3 Mult for your first 7 and last 6 drops of each jar. It no longer gives ×2 for the rest of the jar.']},
 {v:'1.22',d:'13 Nov 2026',t:'Jar summary',i:['Rogue leaderboard: the best 5 scores of each Ripeness, highest Ripeness at the top.','Boss jars show the boss in the corner of the jar. Tap it to pause and read what it does.','Jar cleared now shows your score against the target, the drops you had left, and stats for that jar: merges, biggest fruit, best merge, best combo, tools used and pet meals.']},
 {v:'1.21',d:'13 Nov 2026',t:'Accounts',i:['Almanac: a new Fruit tab lists every size in order, and the rock, with a few words about each one.','Show button to see your password as you type it. Creating an account asks for the password twice.','Sign in from the menu, next to Options.','Fixed: the account screens closed as soon as the phone keyboard opened.','Create an account in Options to keep your progress safe online and play on other devices. It is optional.','Your username is yours on the leaderboard: nobody else can post scores under it.','Names with slurs or swears can not be used.']},
 {v:'1.20',d:'13 Nov 2026',t:'Rare is rare',i:['Rare charms turn up far less often: 4 in 100 shop slots (was 10), and fewer in gold crates. Good Taste still raises the odds.','A rare charm on offer now shines and plays a sound, so you notice it.']},
 {v:'1.19',d:'13 Nov 2026',t:'Fruit names and titles',i:['Fruit have names now: Cherry (1), Strawberry (2), Grape (3), Mandarin (4), Orange (5), Apple (6), Pear (7), Pineapple (8), Peach (9), Rockmelon (10), Watermelon (11).','17 new Rogue awards, and they are hard. Most give a title.','Titles: pick one in Options and it shows before your name on the leaderboard.']},
 {v:'1.18',d:'13 Nov 2026',t:'Pixel fruit',i:['New Install as app button on the menu: put the game on your home screen and play it full screen.','The hand-drawn pixel fruit are now the default. The original drawn fruit are still in Options and the pause screen.','New pear, a new watermelon face and touch-ups to the smaller fruit.','Run info and the Almanac have a close button at the top, no more scrolling to the bottom to get back to the game.']},
 {v:'1.17',d:'13 Nov 2026',t:'Pixel rocks',i:['Beta fruit art now has a pixel art rock too, for every rock in the jar.']},
 {v:'1.16',d:'12 Nov 2026',t:'Pixel coins',i:['Coins are pixel art now, to match the rest of the game.','Small Fry and Feeding Frenzy icons are sharp again.','What\'s new has a close button at the top.']},
 {v:'1.15',d:'12 Nov 2026',t:'Fixes',i:['Fruit no longer spin on the spot once the pile has settled. They only roll when they really move.','Beta fruit art: fruit now touch each other instead of leaving a small gap.']},
 {v:'1.14',d:'12 Nov 2026',t:'Beta fruit art',i:['New Options screen on the menu.','Beta fruit art: turn it on in Options or the pause screen to play with hand-drawn fruit. Mouldy fruit turn green and leak spores. Still a work in progress.']},
 {v:'1.13',d:'12 Nov 2026',t:'New menu',i:['Rogue is now the big button at the top of the menu, with What\'s new next to it. Classic and Wild sit underneath.']},
 {v:'1.12',d:'12 Nov 2026',t:'Stone and countdowns',i:['2 new tools, a new charm and a new fusion.','Charms that fire every few drops or merges show a countdown on their icon. It turns red when the next one fires.','Bosses with a rhythm show what is coming under your score, like Tax in 2 or Rock in 3.']},
 {v:'1.11',d:'12 Nov 2026',t:'New Hedgehog',i:['The Hedgehog no longer rolls through your pile. When the pile reaches the gold line near the top, he climbs up and eats the highest fruit (size 6 or less) for 50 points, at most once every 3 drops.','He counts as a pet that eats, so Pet Bowl, Pet Treats and Big Appetite work with him.']},
 {v:'1.10',d:'12 Nov 2026',t:'Swap and score colours',i:['When your slots are full, the shop shows Swap: pick one of yours to sell and buy the new one in one go.','Rogue scores show the Ripeness they were set on as a coloured number, green for 1 up to deep red for 8.','Long tool names fit the tool bar.']},
 {v:'1.9.1',d:'12 Nov 2026',t:'Fix',i:['Small Fry has a clearer icon.']},
 {v:'1.9',d:'12 Nov 2026',t:'Ripeness',i:['Stakes are now called Ripeness.','Each starting jar opens its own Ripeness levels: win on Ripeness 3 with a jar to open Ripeness 4 for that jar. Wins you already have still count for the jar you won them with.']},
 {v:'1.8.2',d:'12 Nov 2026',t:'Fix',i:['The Melon King\'s rock drops into the lowest gap, the pile gets 3 seconds to settle, and the rock itself never counts as over the line. It could end a run on its own before.']},
 {v:'1.8.1',d:'12 Nov 2026',t:'Fix',i:['A charm or tool taken from a crate is no longer still for sale in the shop, so you can not end up with two of the same.']},
 {v:'1.8',d:'12 Nov 2026',t:'Late-game rares',i:['Blue Ribbon gives ×0.2 Mult per charm you own (was ×0.3).','2 new rare charms.']},
 {v:'1.7.1',d:'12 Nov 2026',t:'Fix',i:['The jar no longer flickers in Rogue mode.']},
 {v:'1.7',d:'12 Nov 2026',t:'Peek, reorder, more fusions',i:['Tap a charm or tool to peek at it in a small card. Tap anywhere else to close it. In a jar the game waits while it is open.','Move charms left and right between jars. Only The Thief cares: it switches off your leftmost charms.','Under Mult you can now see your last merge: points × Mult = score.','5 new fusions.','8 new awards, some of them unlock things.','Pets have their own sounds.','Chain Reaction gives +0.5 Mult per combo step, up to +4 (was +1, up to +8). Wildfire +1 up to +8.']},
 {v:'1.6',d:'12 Nov 2026',t:'Pets',i:['4 new pets for Rogue, each one lives in your jar.','4 new charms that only show up once you have a pet.','A new tool.','2 new fusions.','Pet Caterpillar is faster and waits for something to eat. It now eats 45 points a fruit (was 30), Feeding Frenzy 90 (was 60).','This What\'s new page.']},
 {v:'1.5',d:'11 Nov 2026',t:'New charms and polish',i:['13 new charms.','6 new fusions.','Every charm has its own animation when it triggers.','A new boss.','Drops left is now a bar that turns orange, then red.','The shop keeps its place when you look at a charm. Skip is red, Start jar is bigger.']},
 {v:'1.4',d:'11 Nov 2026',t:'Rogue expansion',i:['Tools you tap during a jar, charged by merging.','Upgrades and Seeds in the shop.','Crates, fusions and skipping jars for a crate.','Bosses get worse at half the target. 14 new bosses and a mini boss.','Awards that unlock new items, and the Almanac.','Ripeness levels (8 difficulty levels, then called stakes) and 6 starting jars.']},
 {v:'1.3',d:'10 Nov 2026',t:'Rogue mode',i:['Rogue mode: depths, bosses, charms and a shop.','Pixel icons and a pixel font.','Install the game to your home screen.','A new watermelon. Mould and the caterpillar are easier in Wild.']},
 {v:'1.0',d:'9 Nov 2026',t:'Launch',i:['Classic and Wild modes.','Online leaderboard.','Wild powers: Swap, Shake, Whirlpool and Rumble.']}];

 const fm=el.querySelector('form'),er=el.querySelector('.nmE'),bt=fm.querySelector('button[type=submit]'),v=k=>(fm.elements[k]&&fm.elements[k].value||'').trim(),pw=()=>fm.elements.pw.value,done=()=>{snd('hi');prof();},sb=fm.querySelector('.pwv');

 fm.onsubmit=e=>{e.preventDefault();er.hidden=true;er.classList.remove('ok');bt.disabled=true;bt.textContent='Please wait...';let p;

   else if(md==='name')p=claimName(v('un')).then(cloudPull).then(done);
   else p=authReq('sendOobCode',{requestType:'PASSWORD_RESET',email:v('em')}).then(()=>acct('in','If that email has an account, a reset link is on its way. Check your spam folder too.',1));}
  catch(x){p=Promise.reject(x);}
  p.catch(x=>{if(x==='shown')return;bt.disabled=false;bt.textContent=f[2];er.textContent=aerr(x);er.hidden=false;snd('nope');});};
 if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>{try{fm.querySelector('input').focus()}catch(_){}},50);} /* no auto focus on phones: the keyboard would cover the form */

   Only that account can pick the title, and score boards show it only beside that username (ttlH drops it from any other row, so a forged score gets nothing). */
const PTL={stbdfHd2LhgJQbpv7jjCoSAZaKU2:{ti:'Habibti',n:'sare',cls:'hb',tr:5,why:'For being the best girlfriend.'},B9EhMhU76IatbPSjcL2ZktLJq1W2:{ti:'Habibi',n:'dee',cls:'hbb',tr:6,why:'For making Overripe.'}},sptOf=ti=>Object.values(PTL).find(x=>x.ti===ti),myT=()=>AU&&PTL[AU.uid]&&AU.name&&AU.name.toLowerCase()===PTL[AU.uid].n?PTL[AU.uid].ti:'';
/* ---------- profiles and friends (v1.53) ----------
   pub/<uid> = {n, ti, st ('a,b,c', the three stats shown), v {stat: value}, b {c, w (best Classic and Wild), r {k1..k8: best Rogue per Ripeness}}, t}: any signed-in player reads it, its owner writes it (pubPush, with every cloudPush). The three stats are a device preference, store key pst.
   freq/<to>/<from> = {n, t}: a friend request. frd/<uid>/<other> = the other's username, written in pairs when a request is accepted, and the rules only allow that against a pending request. Friends boards read each friend's pub (b for Classic, Wild, Rogue) and the daily board filtered by uid */
const PST={fav:['Favourite fruit',S=>{let b=-1,n=0;for(let l=0;l<=10;l++)if((S['made.'+l]||0)>n){n=S['made.'+l];b=l;}return b;},v=>v>=0?fnm(v):'None yet'],

 big:['Biggest merge',S=>S.bestMerge||0,shortN],mult:['Best Mult',S=>S.bestMult||0,v=>'×'+num(v)],combo:['Best combo',S=>S.bestCombo||0,v=>'×'+v],fruit:['Biggest fruit',S=>S.bestFruit==null?-1:S.bestFruit,v=>v>=0?fnm(v):'None yet'],
 depth:['Deepest depth',S=>S.bestDepth||0,v=>v],rip:['Highest Ripeness won',()=>Math.max(0,...Object.values((PF.d||PF.load()).stakes)),v=>v||'None yet'],wins:['Rogue wins',S=>S.wins||0,shortN],runs:['Rogue runs',S=>S.runs||0,shortN],
 merges:['Merges',S=>S.merges||0,shortN],melons:['Watermelons made',S=>S['made.10']||0,shortN],golds:['Gold merges',S=>S.golds||0,shortN],kills:['Fruit destroyed',S=>S.kills||0,shortN],bosses:['Bosses beaten',S=>S.bosses||0,shortN],

  if(a==='runs'){if(G.state!=='menu')return say('From the menu only.');teleView();return say('Run data loaded from /runs.');}if(a==='code'){if(G.state!=='menu')return say('From the menu only.');codeMk();return say('Make a code: title, rarity, uses.');}
  if(a==='pfx'){PF.d=PF.blank();PF.dirty=1;PF.save();lookSync();return say('Profile reset.');}
  if(a==='pfu'){for(const k in LOCK)PF.d.unlocked[k]=PF.d.unlocked[k]||Date.now();PF.dirty=1;PF.save();return say('Everything unlocked. Awards are not marked as earned.');}
  if(a==='new'){const R=RG.new(v('#dvA'),clampN(+v('#dvK2')||1,1,8));R.dev=1;rgStart(R);return say('Dev run started.');}
  if(!RUN)return say('Start a Rogue run first.');
  if(a==='win'){if(G.state!=='play')return say('Only while a jar is being played.');RUN.dev=1;G.g.cheat();return say('Target filled.');}
  if(a==='coins'){RUN.dev=1;RUN.coins+=20;if(idle)redraw();return say('+20 coins.');}
  if(!idle)return say('Only between jars (hub or shop).');
  if(a==='go'){RUN.depth=clampN(+v('#dvD')||1,1,99);RUN.jar=+v('#dvJ');RG.boss(RUN);G.g.wipe();RG.offer(RUN);RUN.shop=RG.stock(RUN);RUN.at='hub';}
  else if(a==='ct'){if(RG.jarCfg(RUN).boss)return say('Not on a boss jar.');const id=v('#dvQ');RUN.ct={id,on:0,sd:CT[id].pay[0]==='sd'?RG.sizes(RUN)[0]:undefined};}
  else if(a==='tag'){const id=v('#dvR');if(id==='crate')return say('Use the Crate row.');RUN.tg[id]=SKR[id].u;}
  else if(a==='boss'){RG.boss(RUN);RUN.bs[RUN.depth-1]=v('#dvB');}
  else if(a==='cur'){const k=v('#dvE'),c=RG.curse(RUN);c[CUR[k].k==='en'?0:1]=k;}
  else if(a==='charm'){const id=v('#dvC'),e=v('#dvE'),o=e?{id,e}:{id};if(RG.has(RUN,id))return say('Already owned.');if(CH[id].o){if(RUN.or.length>=RG.os(RUN))RUN.or.shift();RUN.or.push(o);}else{if(RUN.ch.length>=RG.slots(RUN))RUN.ch.shift();RUN.ch.push(o);}}
  else if(a==='tool'){const id=v('#dvT'),e=v('#dvE');if(RUN.tl.some(t=>t.id===id))return say('Already owned.');if(RUN.tl.length>=RG.ts(RUN))RUN.tl.shift();const t=RG.tool(id,RUN);if(e)t.e=e;RUN.tl.push(t);}
  else if(a==='up'){const id=v('#dvU');if(!RG.upOk(RUN,id)&&id!=='scrub'&&id!=='clean')return say('Not available now.');if(id==='scrub'||id==='clean')G.g[id]();else if(id==='bribe')RG.bribe(RUN);else RUN.up[id]++;}
  else if(a==='seed')RUN.sd[+v('#dvS')]++;
  else if(a==='crate'||a==='lcrate'){RUN.dev=1;RUN.crate=a==='crate'?RG.crate(RUN,v('#dvK'),RUN.at==='shop'?'shop':'hub'):RG.crate(RUN,'wood',RUN.at==='shop'?'shop':'hub','ch',1);rgHead();rgCrate();return say('Crate opened.');}
  RUN.dev=1;redraw();say('Done. This run no longer counts.');});})();

/* opening splash: logo.png is 16 frames of 100x16 (4x4), cropped to the art (x 4 to 85, y 2 to 14) and scaled to fill the screen width less 16px each side (whole device pixels per art pixel), played at 10 fps (frames 1-4 and 13-16 are holds), the last frame held 0.9s more, then a 0.35s fade. Tap or key skips. Still frame 1 under reduced motion, none with ?dev */
(function(){const e=$('#spl'),i=e.firstChild;if(/[?&]dev\b/.test(location.search))return e.remove();const d=devicePixelRatio||1,z=Math.max(1,Math.floor(Math.min((innerWidth-32)/81,innerHeight*.6/12)*d))/d;Object.assign(i.style,{width:81*z+'px',height:12*z+'px',backgroundSize:400*z+'px '+64*z+'px'});let n=0,tm=0,dn=0;const fin=()=>{if(dn)return;dn=1;clearTimeout(tm);e.classList.add('out');removeEventListener('keydown',fin);setTimeout(()=>e.remove(),400);},fr=k=>i.style.backgroundPosition=-((k%4)*100+4)*z+'px '+-((k>>2)*16+2)*z+'px',st=()=>{if(dn)return;if(RMO){fr(0);tm=setTimeout(fin,1000);return;}const t=()=>{if(dn)return;fr(n);tm=n<15?setTimeout(t,100,n++):setTimeout(fin,1000);};t();};e.onclick=fin;addEventListener('keydown',fin);const im=new Image();im.onload=st;im.onerror=fin;im.src='logo.png';setTimeout(fin,4500);})();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(G.state==='menu')menu()});
