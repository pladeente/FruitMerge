const MAXS=10,SKEY={classic:'scores2',wild:'scoresWild2',rogue:'scoresRogue'},MNAME={classic:'Classic',wild:'Wild',rogue:'Rogue'},GOC={classic:'',wild:' wild',rogue:' rogue'};

const ASP=.68; /* jar width / height */

/* ---------- sound: small synth ---------- */
let AC=null,master=null,NB=null;

function tone(f,d,o={}){const{type='sine',vol=.3,slide=0,at=0,attack=.005}=o;const a=ac(),t=a.currentTime+at,os=a.createOscillator(),g=a.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.001,t+d);os.connect(g).connect(master);os.start(t);os.stop(t+d+.03);}

const PENTA=[262,294,330,392,440,523,587,659,784,880,1047];
const SFX={
 ui(){tone(700,.06,{vol:.12,slide:1.3})},

 fly(){[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.3,{vol:.1,at:i*.06}))},
 coin(){tone(988,.07,{type:'square',vol:.06});tone(1319,.28,{type:'square',vol:.06,at:.07})},

};

const chD=c=>CH[c.id].d+(CH[c.id].live?` <b>Now +${num(c.v||0)}.</b>`:'');
const tile=(id,cls,tag='i',at='')=>`<${tag} class="tile ${cls}"${at}>${ic(icn(id),1)}</${tag}>`;
const chip=r=>`<small class="chip r${r}">${RAR[r]}</small>`;
function rgTitle(icon,s){const t=$('#hd .t');t.className='t';t.innerHTML=ic(icon)+' '+s;$('#lbB').hidden=false;G.chKey=null;}
/* during a run the header shows the five charm slots. Tap one to inspect or sell it */
function rgHead(){const t=$('#hd .t');t.className='t ch';let h='';for(let i=0;i<SLOTS;i++){const c=RUN.ch[i];h+=c?`<button class="slot r${CH[c.id].r}" data-i="${i}" aria-label="${CH[c.id].n}">${ic(icn(c.id))}</button>`:'<span class="slot e"></span>';}
 t.innerHTML=h;$('#lbB').hidden=true;G.chKey=RUN.ch.map(c=>c.id).join();}
function rgPulse(ids){if(!RUN||G.chKey==null)return;const t=$('#hd .t');for(const id of ids){const el=t.children[RUN.ch.findIndex(c=>c.id===id)];if(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');}}}
function rgSave(){RUN.pile=G.g?G.g.snap():[];store.set('run',RUN);}
function rgBar(){const m=RG.score(RUN,0,{l:-1,combo:0,n:0,idle:1,jd:99,dl:99,jm:0,pu:0,high:false}).m;return `<p class="tg">Base Mult ×${m.toFixed(1)} · ${cn(RUN.coins)} · Run score ${RUN.total}</p>`;}
function rgTrack(){let h='';for(let j=0;j<3;j++){const c=RG.jarCfg(RUN,j),done=j<RUN.jar;h+=`<div class="nd${done?' done':j===RUN.jar?' cur':''}${c.boss?' boss':''}">${done?ic('check'):c.boss?`<i class="slot boss">${ic(icn(c.boss))}</i>`:`<u>${j+1}</u>`}<b>${c.boss?'Boss':'Jar '+(j+1)}</b><small>${done?'Done':'Score '+c.quota}</small></div>`;}
 const b=BOSS[RG.boss(RUN)],nx=RG.jarCfg(RUN);return `<div class="trk">${h}</div><p class="rule"><b>Boss: ${b.n}.</b> ${b.d}</p><p class="nxt">Next: <b>${nx.boss?b.n:'Jar '+(RUN.jar+1)}</b>. Score <b>${nx.quota}</b> in <b>${nx.drops}</b> drops for ${cn(nx.pay)}</p>`;}
function rgIntro(){if(G.state!=='menu'||RUN)menu();G.mode='rogue';store.set('mode','rogue');setBest();const sv=store.get('run',null),ok=sv&&sv.v===2;
 const m=show(`<h3>Rogue run</h3><p>Go ${DEPTHS} depths down. Each depth is 3 jars, and the third is a <b>boss</b> with a nasty rule.</p><ul class="wl">
<li><span>${ic('bull')}</span><div>Hit the jar's <b>score target</b> before your <b>drops</b> run out. Run dry or overflow and the run is over.</div></li>
<li><span>${ic('hoard')}</span><div>The pile <b>carries over</b> from jar to jar. It is emptied at each new depth.</div></li>
<li><span>${ic('wallet')}</span><div>Cleared jars pay coins. Spend them in the shop on <b>charms</b> (hold up to ${SLOTS}) and upgrades, or on powers mid-jar. Saved coins earn interest.</div></li>
<li><span>${ic('gold')}</span><div>A merge scores its points times your <b>Mult</b>. Charms push both up, and the right pairs <b>combo</b>.</div></li></ul>
<canvas id="chain"></canvas><p style="font-size:15px;color:var(--muted);margin:0">Fruit sizes, as charms and bosses call them.</p>
${ok?`<button class="go rogue" data-a="rcont">Continue (depth ${sv.depth}, jar ${sv.jar+1})</button><br>`:''}<button class="go${ok?' alt':' rogue'}" data-a="rnew">New run</button><button class="go alt" data-a="menu">Back</button>`);chain(m,1);}
function rgStart(R){RUN=R;G.mode='rogue';store.set('mode','rogue');setBest();hide();FLOAT.length=0;G.g=null;pw.hidden=false;G.pwKey='';G.lastCoins=R.coins;G.over=null;rgHead();fit();G.W=G.cssW;G.H=G.cssH;fit();
 G.g=makeGame(G.W,G.H,false,null,RG.ro(R,rgClear,rgEnd,rgPulse));if(R.pile&&R.pile.length)G.g.load(R.pile);G.last=0;if(R.at==='shop'&&R.shop)rgShop();else rgHub();}
function rgHub(){G.state='rogue';$('#pauseB').hidden=true;RUN.at='hub';rgSave();
 show(`<div class="mode">Rogue run</div><h3>${jn()}</h3>${rgTrack()}${rgBar()}<button class="go rogue" data-a="rgo">Start jar</button><br><button class="go alt sm" data-a="rinfo">Run info</button><button class="go alt sm" data-a="menu">Save &amp; quit</button>`);}
function rgInfo(){const nb=RG.boss(RUN),ups=Object.keys(UPG).filter(k=>k!=='scrub'&&RUN.up[k]);
 show(`<div class="mode">${jn()} · jar ${RUN.jar+1} of 3</div><h3>Run info</h3>${rgBar()}<div class="sec"><h5>Your charms (${RUN.ch.length}/${SLOTS}) <small>Tap one to inspect or sell it.</small></h5>${RUN.ch.length?`<ul class="it">${RUN.ch.map((c,i)=>`<li data-a="rch" data-i="${i}">${tile(c.id,'r'+CH[c.id].r)}<div><b>${CH[c.id].n}</b> ${chip(CH[c.id].r)}<br>${chD(c)}</div></li>`).join('')}</ul>`:'<p class="none">None yet. Buy some in the shop.</p>'}</div>
${ups.length?`<div class="sec"><h5>Upgrades</h5><ul class="it">${ups.map(k=>`<li>${tile(k,'up')}<div><b>${UPG[k].n} ×${RUN.up[k]}</b><br>${UPG[k].d}</div></li>`).join('')}</ul></div>`:''}
<div class="sec"><h5>This depth's boss</h5><ul class="it"><li>${tile(nb,'boss')}<div><b>${BOSS[nb].n}</b><br>${BOSS[nb].d}</div></li></ul></div><button class="go alt" data-a="${G.state==='pause'?'paused':'rback'}">Back</button>`);}
function rgCharm(i){const c=RUN.ch[i];if(!c)return rgInfo();const d=CH[c.id];
 show(`<div class="mode">Charm ${i+1} of ${RUN.ch.length}</div>${tile(c.id,'big r'+d.r)}<h3>${d.n}</h3><p>${chip(d.r)}</p><p>${chD(c)}</p><button class="go alt" data-a="rsell" data-i="${i}">Sell for <i class="coin"></i>${Math.floor(d.c/2)}</button><button class="go" data-a="${G.state==='pause'?'resume':'rback'}">Back</button>`);}
function rgGo(){const c=RG.jarCfg(RUN);RUN.cfg=c;hide();FLOAT.length=0;G.g.jar(c);G.state='play';G.last=0;$('#pauseB').hidden=false;}
function rgClear(left){const c=RUN.cfg,rows=RG.payout(RUN,c,left),was=`Depth ${RUN.depth} · ${c.boss?BOSS[c.boss].n:'Jar '+(RUN.jar+1)}`;let sum=0;for(const r of rows)sum+=r[1];
 const win=RG.advance(RUN,sum);FLOAT.length=0;if(RUN.jar===0)G.g.wipe();G.state='rogue';$('#pauseB').hidden=true;rgSave();
 const pay=`<ul class="wl">${rows.map(r=>`<li><div>${r[0]}</div><em><i class="coin"></i>+${r[1]}</em></li>`).join('')}<li><div><b>Total</b></div><em><i class="coin"></i>+${sum}</em></li></ul>`;
 if(win){snd('hi');show(`<div class="mode">${was}</div>${tile('melon','big boss')}<h3>You win!</h3><p>The Melon King is juice. Run score:</p><div class="big">${RUN.total}</div>${pay}<p>Bank this score, or go deeper for a bigger one.</p><button class="go rogue" data-a="rshop">Go deeper</button><button class="go alt" data-a="rbank">Bank score</button>`);}
 else show(`<div class="mode">${was}</div><h3>Jar cleared!</h3>${pay}<p class="tg">You now have ${cn(RUN.coins)}</p><button class="go rogue" data-a="rshop">Shop</button>`);}
function rgShop(keep){G.state='rogue';$('#pauseB').hidden=true;RUN.at='shop';rgSave();const S=RUN.shop,full=RUN.ch.length>=SLOTS,rr=RG.cost(RUN,2+S.rr),old=ui.querySelector('.msg'),sy=keep&&old?old.scrollTop:0;
 const buy=(a,i,p,no)=>`<button class="go sm" data-a="${a}" data-i="${i}"${no||RUN.coins<p?' disabled':''}>${no?'Full':'<i class="coin"></i>'+p}</button>`;
 const it=S.ch.map((id,i)=>{if(!id)return'';const d=CH[id];return `<li>${tile(id,'r'+d.r)}<div><b>${d.n}</b> ${chip(d.r)}<br>${d.d}</div>${buy('rbuy',i,RG.cost(RUN,d.c),full)}</li>`}).join('');
 const up=S.up.map((id,i)=>{if(!id)return'';const d=UPG[id];return `<li>${tile(id,'up')}<div><b>${d.n}</b>${id!=='scrub'&&RUN.up[id]?` <small class="chip">Owned ×${RUN.up[id]}</small>`:''}<br>${d.d}</div>${buy('rup',i,RG.upCost(RUN,id))}</li>`}).join('');
 let own='';for(let i=0;i<SLOTS;i++){const c=RUN.ch[i];own+=c?tile(c.id,'r'+CH[c.id].r,'button',` data-a="rch" data-i="${i}" aria-label="${CH[c.id].n}"`):'<i class="tile e"></i>';}
 const m=show(`<div class="mode">${jn()}</div><h3>Shop</h3><p class="tg">You have ${cn(RUN.coins)}</p>
<div class="sec"><h5>Charms <small>Items that work on their own once bought. You can hold ${SLOTS}.${full?' Sell one to make room.':''}</small></h5>${it?`<ul class="it">${it}</ul>`:'<p class="none">Sold out.</p>'}</div>
<div class="sec"><h5>Upgrades <small>Permanent boosts. They don't take a slot.</small></h5>${up?`<ul class="it">${up}</ul>`:'<p class="none">Sold out.</p>'}</div>
<button class="go alt sm" data-a="rroll"${RUN.coins<rr?' disabled':''}>Reroll shop <i class="coin"></i>${rr}</button>
<div class="sec"><h5>Your charms (${RUN.ch.length}/${SLOTS}) <small>Tap one to inspect or sell it.</small></h5><div class="own">${own}</div></div>
<div class="sec"><h5>Up next</h5>${rgTrack()}</div><button class="go rogue" data-a="rgo">Start jar</button><br><button class="go lnk" data-a="menu">Save &amp; quit</button>`);m.scrollTop=sy;}
function rgEnd(why){G.over={why,d:RUN.depth,j:RUN.jar};store.set('run',null);gameOver(RUN.total);}
function ovH(){const o=G.over;if(G.mode!=='rogue'||!o)return '<h3>Game over!</h3>';if(o.why==='win')return `<h3>Run complete!</h3><p class="tg">You beat ${o.d>DEPTHS+1?o.d-1:'all '+DEPTHS} depths.</p>`;
 return `<h3>Run over!</h3><p class="tg">${o.why==='over'?'The pile overflowed':o.why==='drops'?'Out of drops':'Ended'} on depth ${o.d}, ${o.j===2?'the boss':'jar '+(o.j+1)}.</p>`;}
function rgAct(a,b){const i=+b.dataset.i,sure=t=>{if(b.dataset.sure)return true;b.dataset.sure=1;b.textContent=t;return false;},back=()=>{if(G.state==='pause')pauseMsg();else if(RUN.at==='shop')rgShop(1);else rgHub();};
 if(a==='rogue')rgIntro();
 else if(a==='rnew'){const sv=store.get('run',null);if(!sv||sv.v!==2||sure('Tap again to drop your saved run'))rgStart(RG.new());}
 else if(a==='rcont'){const sv=store.get('run',null);if(sv&&sv.v===2)rgStart(sv);else rgIntro();}
 else if(!RUN||a[0]!=='r')return false;
 else if(a==='rgo')rgGo();else if(a==='rhub')rgHub();else if(a==='rshop')rgShop();else if(a==='rinfo')rgInfo();else if(a==='rch')rgCharm(i);else if(a==='rback')back();
 else if(a==='rbank')rgEnd('win');
 else if(a==='rquit'){if(sure('Tap again to end the run'))rgEnd('quit');}
 else if(a==='rbuy'){if(RG.buy(RUN,i)){snd('coin');rgShop(1);}}
 else if(a==='rup'){const id=RG.buyUp(RUN,i);if(id){if(id==='scrub'&&RG.kill(RUN,G.g.scrub()))rgPulse(['compost']);snd('coin');rgShop(1);}}
 else if(a==='rsell'){if(sure('Tap again to sell')&&RG.sell(RUN,i)){snd('coin');back();}}
 else if(a==='rroll'){if(RG.reroll(RUN)){snd('swap');rgShop(1);}}
 else return false;
 return true;}
$('#hd .t').onclick=e=>{if(!RUN||G.state==='over')return;const s=e.target.closest('.slot');if(G.state==='play')pause();if(G.state!=='pause'&&G.state!=='rogue')return;snd('ui');if(s&&s.dataset.i!=null)rgCharm(+s.dataset.i);else rgInfo();};

ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;snd('ui');if(rgAct(a,b))return;
 if(a==='play')play(b.dataset.m||G.mode);else if(a==='scores'){G.lbFrom='menu';showScores()}else if(a==='paused')pauseMsg();else if(a==='tab')showScores(b.dataset.m);else if(a==='scope'){G.scope=b.dataset.s;showScores(G.tab||G.mode)}else if(a==='wildinfo')wildInfo();else if(a==='install')install();else if(a==='menu'||a==='quit')menu();
 else if(a==='resume'){hide();G.state='play';G.last=0;$('#pauseB').hidden=false}
 else if(a==='skip')showOver(G.pending,-1);
 else if(a==='reset'){const m=G.tab||G.mode;if(b.dataset.sure){SC[m]=[];store.set(SKEY[m],[]);setBest();showScores(m)}else{b.dataset.sure=1;b.textContent='Tap again to clear '+MNAME[m]+' scores'}}});
$('#pauseB').onclick=pause;
/* ---------- install to home screen ---------- */
let instPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBtn(){return !standalone()&&(instPrompt||matchMedia('(pointer:coarse)').matches)?'<button class="go alt sm" data-a="install">Install app</button>':''}
function syncInstall(){const s=$('#instSlot');if(s)s.innerHTML=installBtn()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instPrompt=e;syncInstall()});
window.addEventListener('appinstalled',()=>{instPrompt=null;syncInstall()});
function install(){if(instPrompt){const p=instPrompt;instPrompt=null;p.prompt();(p.userChoice||Promise.resolve()).finally(syncInstall);return}
 show(`<h3>Install</h3><p>Put Fruit Merge on your home screen. It opens full screen like an app.</p>${isIOS
  ?'<ol class="wl"><li><span>1</span><div>Tap <b>Share</b> (the square with an arrow). In Safari it is at the bottom, in Chrome it is in the address bar.</div></li><li><span>2</span><div>Scroll down and tap <b>Add to Home Screen</b>.</div></li><li><span>3</span><div>Tap <b>Add</b>.</div></li></ol>'
  :'<ol class="wl"><li><span>1</span><div>Open your browser menu (<b>⋮</b> or <b>☰</b>).</div></li><li><span>2</span><div>Tap <b>Install app</b> or <b>Add to Home screen</b>.</div></li></ol>'}<button class="go alt" data-a="menu">Back</button>`)}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
$('#lbB').onclick=()=>{if(G.state==='over'&&G.pending!=null)return;snd('ui');if(G.state==='play')pause();G.lbFrom=G.state==='pause'?'pause':G.state==='rogue'&&RUN?'rogue':'menu';showScores()};
function setSnd(){$('#sndB').innerHTML=ic(sndOn?'snd_on':'snd_off');$('#sndB').setAttribute('aria-pressed',sndOn)}
$('#sndB').onclick=()=>{sndOn=!sndOn;store.set('snd2',sndOn);setSnd();snd('ui')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.addEventListener('resize',()=>{fit();if(G.state==='menu')menu()});
setSnd();setBest();menu();G.raf=requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(G.state==='menu')menu()});
</script>
</body></html>
