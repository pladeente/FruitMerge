<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overripe</title>
<meta name="description" content="Drop fruit, merge matching ones, make a watermelon.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120a1f">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overripe">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="spl"><i></i></div>
<div id="app">
 <div id="hd">
  <span class="t"><i class="logo" role="img" aria-label="Overripe"></i></span>
  <button class="pill" id="lbB" title="Leaderboard (your best score)" aria-label="Open leaderboard"><i class="px px-trophy"></i> <span id="best">0</span></button>
  <button class="ib" id="pauseB" aria-label="Pause" hidden>II</button>
 </div>
 <div id="stage"><canvas id="cv"></canvas><button id="bossB" hidden aria-label="Boss rules"></button><div id="cuB" hidden></div><div id="ui"></div><div id="toast" hidden></div></div>
 <div id="pw" hidden>
  <div id="dr"><div class="db" id="db"><b></b><span></span></div><button class="ib" id="iB" aria-label="Run info, Almanac, Options and pause">i</button></div>
  <div class="coins" id="coins" title="Coins"><i class="coin"></i><span id="coinN">0</span></div>
  <button class="pwb" data-p="swap" title="Swap your fruit with the next one (key 1)"><b><i class="px px-swap"></i></b>Swap<em><i class="coin"></i><span class="pc">5</span></em></button>
  <button class="pwb" data-p="shake" title="Shake the jar (key 2)"><b><i class="px px-shake"></i></b>Shake<em><i class="coin"></i><span class="pc">12</span></em></button>
  <button class="pwb" data-p="whirl" title="Swirl the whole pile around the jar (key 3)"><b><i class="px px-whirl"></i></b>Whirl<em><i class="coin"></i><span class="pc">15</span></em></button>
  <button class="pwb" data-p="rumble" title="Rumble the jar so the pile jiggles and settles (key 4)"><b><i class="px px-rumble"></i></b>Rumble<em><i class="coin"></i><span class="pc">10</span></em></button>
  <div id="tb"></div>
 </div>
</div>
<script src="icons.js"></script>
<script src="rogue.js"></script>
<script src="core.js"></script>
<script src="draw.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script src="social.js"></script>
<script src="rogue-ui.js"></script>
<script src="glue.js"></script>
<script src="tutorial.js"></script>
<script src="dev.js"></script>
<script src="boot.js"></script>
</body></html>
