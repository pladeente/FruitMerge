:root{color-scheme:dark;--ink:#1f1430;--plum:#2f1e47;--panel:#3a2658;--line:#58407d;--brass:#f4bb4a;--brass-d:#a96f16;--coral:#f0705f;--teal:#35c2b4;--cream:#fff2d8;--muted:#c9b8dc;--display:'Cherry Bomb One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;--body:'Sniglet',system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{height:100%;margin:0}
body{background:#120a1f;color:var(--cream);font:17px/1.4 var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-sizing:border-box}
#hd{width:100%;max-width:480px;display:flex;align-items:center;gap:6px}
#hd .t{flex:1;font:400 clamp(15px,4.9vw,23px) var(--display);color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:800 15px var(--body);background:var(--plum);min-height:44px;padding:0 12px;border-radius:22px;color:var(--teal);white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 2px var(--line)}
.pill:active{transform:translateY(1px)}
.ib{min-width:44px;height:44px;padding:0 10px;border-radius:22px;background:var(--panel);font:800 16px var(--body)}
#stage{position:relative;overflow:hidden;border-radius:14px;flex:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#pw{width:100%;display:flex;gap:6px;align-items:stretch;flex:none}
#pw[hidden]{display:none}
.coins{display:flex;align-items:center;gap:5px;padding:0 8px;background:var(--plum);border-radius:12px;font:400 clamp(17px,5.4vw,22px) var(--display);color:#ffd43b;min-width:50px;justify-content:center;font-variant-numeric:tabular-nums}
.coins.up{animation:cup .35s ease-out}
@keyframes cup{40%{transform:scale(1.18);background:#4b3570}}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc61a 45%,#e09600);box-shadow:inset 0 0 0 2px #b87700;flex:none}
.pwb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px 6px;border-radius:12px;background:var(--panel);box-shadow:0 3px 0 #1b1029;font:800 clamp(11px,3.5vw,13px) var(--body);line-height:1.1}
.pwb b{font-size:20px;line-height:1.1}
.pwb em{font-style:normal;color:#ffd43b;display:flex;align-items:center;gap:3px}
.pwb em .coin{width:10px;height:10px;box-shadow:inset 0 0 0 1.5px #b87700}
.pwb:disabled{opacity:.38;cursor:default}
.pwb:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #1b1029}
.pwb.on{background:var(--teal);color:#07302c}
.pwb{position:relative;overflow:hidden}
.pwb .cd{position:absolute;inset:0;background:#120a1fc0;transform-origin:bottom;transform:scaleY(var(--cd,0));pointer-events:none}
.pwb .cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 24px var(--display);color:var(--cream);text-shadow:0 2px 0 #000a;pointer-events:none}
.pwb .cdn:empty{display:none}
.pwb.cool:disabled{opacity:1}
.msg{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--plum);border:3px solid var(--line);border-radius:18px;padding:16px 18px;width:90%;max-width:380px;text-align:center;box-shadow:0 10px 40px #0008;max-height:94%;overflow-y:auto;box-sizing:border-box}
.msg h3{margin:0 0 6px;font:400 32px var(--display);color:var(--brass)}
.msg h4{margin:12px 0 0;font:400 20px var(--display);color:var(--teal)}
.msg p{margin:6px 0;font-size:16px}
.msg .tg{color:var(--teal)}
.big{font:400 54px/1.1 var(--display);color:var(--cream)}
.go{display:inline-block;margin:10px 4px 0;padding:10px 22px;border-radius:12px;background:var(--brass);color:var(--ink);font:400 20px var(--display);box-shadow:0 4px 0 var(--brass-d)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brass-d)}
.go.alt{background:var(--panel);color:var(--cream);box-shadow:0 4px 0 #1b1029}
.go.wild{background:#7bc950;box-shadow:0 4px 0 #3f7f22}
.go.sm{font:800 15px var(--body);padding:8px 14px}
#chain{display:block;margin:8px auto 2px;width:100%;height:44px}
table{width:100%;border-collapse:collapse;margin:8px 0 2px;font-variant-numeric:tabular-nums}
td{padding:4px 6px;text-align:left;font-size:16px;border-bottom:1px solid #ffffff14}
td:first-child{width:28px;color:var(--muted);font-weight:800}
td:nth-child(3){text-align:right;font-family:var(--display);color:var(--brass)}
td:last-child{text-align:right;color:var(--muted);font-size:13px;width:70px}
tr.me td{background:#35c2b42a}
.none{color:var(--muted);margin:12px 0}
.nm{display:flex;gap:6px;margin:10px 0 2px}
.nm input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--ink);font-size:18px;-webkit-user-select:text;user-select:text}
.nm .go{margin:0;padding:8px 16px}
.new{display:inline-block;background:var(--coral);color:#fff;font:400 16px var(--display);padding:3px 12px;border-radius:7px;transform:rotate(-3deg)}
.lnk{background:none;box-shadow:none;color:var(--muted);text-decoration:underline;font:15px var(--body);margin-top:8px}
.tabs{display:flex;gap:6px;justify-content:center;margin:4px 0}
.tabs button{padding:6px 16px;border-radius:9px;background:var(--panel);font:800 16px var(--body);color:var(--muted)}
.tabs button.on{background:var(--teal);color:#07302c}
.wl{list-style:none;margin:6px 0 0;padding:0;text-align:left}
.wl li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #ffffff12;font-size:14px;line-height:1.28}
.wl li span{font-size:19px;line-height:1;flex:none;width:28px;text-align:center}
.wl b{color:var(--brass)}
.mode{font:800 14px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.go.rogue{background:#b388eb;box-shadow:0 4px 0 #6b3fb0}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:0 8px}
.modes .go{margin:10px 0 0;padding:10px 15px}
.go:disabled{opacity:.45;cursor:default}
.wl li>div{flex:1;min-width:0}
.wl li>em{font-style:normal;color:#ffd43b;font-weight:800;white-space:nowrap;align-self:center;display:flex;align-items:center;gap:4px}
.wl li>em .coin,.cn .coin{width:12px;height:12px}
.wl li>.go{margin:0;align-self:center;flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.wl li.cur{background:#35c2b42a;border-radius:8px}
.wl li.done{opacity:.5}
.wl small{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border-radius:6px;background:#ffffff1c;color:var(--muted);white-space:nowrap}
.wl small.r1{background:#35c2b440;color:#8ff0e6}.wl small.r2{background:#f4bb4a40;color:var(--brass)}
.cn{display:inline-flex;align-items:center;gap:4px;color:#ffd43b;font-weight:800;text-decoration:none}
#hd .t.ch{cursor:pointer;letter-spacing:2px}
</style></head><body>

 <div id="hd">

  <button class="pill" id="lbB" title="Leaderboard (your best score)" aria-label="Open leaderboard">🏆 <span id="best">0</span></button>
  <button class="ib" id="sndB" aria-label="Toggle sound">🔇</button>

 if(f.frz>0){const k=1-f.frz/3,n=Math.floor(k*7);c.strokeStyle='#ffffff';c.lineWidth=1.6;for(let i=0;i<n;i++){const a=f.seed+i*2.1,len=r*(.6+.3*(i%3)/2);let px=x,py=y;c.beginPath();c.moveTo(px,py);for(let s=1;s<=3;s++){const aa=a+(s%2?.35:-.3);px+=Math.cos(aa)*len/3;py+=Math.sin(aa)*len/3;c.lineTo(px,py);}c.stroke();}}}

/* ---------- the game ---------- */
const MOLD_MAX=5; /* tiers above this never go mouldy */
const SPN={sticky:'STICKY',slip:'SLIPPERY',bomb:'BOOM',magnet:'MAGNET',ice:'FROZEN',stone:'ROCK'};

const SPW=[['sticky',3],['slip',3],['magnet',3],['ice',2],['bomb',1]],SPT=12;
function makeGame(W,H,wild,onOver,ro){ /* ro = rogue run hooks (RG.ro), null in Classic and Wild */
 const K=W/400,L=12,Rw=W-12,bot=H-12,line0=H-Math.floor(W/ASP)+Math.round(Math.floor(W/ASP)*.2);let line=line0;const rad=l=>FRUIT[l][1]*W;const tri=l=>(l+1)*(l+2)/2;
 let fr=[],cur=rint(3),nxt=rint(3),curSp=null,nxtSp=null,cx=W/2,cool=0,overT=0,score=0,parts=[],over=false,drops=0,time=0,shake=0;
 const cd={swap:0,shake:0,whirl:0,rumble:0};
 let cat=null,catT=wild?45:1e9,meals=0,coins=0,whirl=0,wdir=1,rumble=0,settle=0,rt=0,grace=0,combo=0,lastM=-9;
 const merge=[];
 /* rogue: J = the jar being played, B = its boss flags, js = score this jar, dl/jd = drops left/made, jm = merges this jar */
 let J=null,B={},js=0,dl=0,jd=0,jm=0,seq=0,done=0,doneT=0,lastD=0,ptop=bot,ban=null,pu={},catB=0;
 const hiY=()=>line+(bot-line)*.3;
 const rc=(l,o)=>Object.assign({l,combo:0,bull:false,n:fr.length,jd,dl,jm,pu:Object.keys(pu).length,high:ptop<hiY()},o);
 const gain=p=>{js+=p;ro.total+=p;score=ro.total;};
 const genT=()=>(B.swarm?rint(2):Math.random()<.05?4:rint(4))+(ro.has('soil')?1:0);
 const genSp=()=>{seq++;return B.slick?'slip':B.sticky&&seq%3===0?'sticky':B.ice&&seq%4===0?'ice':B.stone&&seq%5===0?'stone':ro.has('boom')&&seq%6===4?'bomb':ro.has('lode')&&seq%5===2?'magnet':null;};
 const deal=()=>{nxt=genT();nxtSp=genSp();if(nxtSp==='magnet'){const t=commonTier();if(t>=0)nxt=t;}};
 const isSt=f=>!!(f.stuck||f.frz>0);
 const noMerge=f=>f.sp==='bomb'||f.sp==='ice'||f.sp==='stone'||f.rot||f.frz>0;
 const pickSp=()=>{if(!wild||drops<4||curSp||Math.random()>.2)return null;let r=Math.random()*SPT;for(const[k,w]of SPW){if((r-=w)<0)return k;}return 'sticky';};
 function commonTier(){const n=[0,0,0,0,0];for(const f of fr)if(f.l<5&&!noMerge(f)&&!isSt(f))n[f.l]++;let b=-1,bv=0;n.forEach((v,i)=>{if(v>bv){bv=v;b=i}});return b;}

<li><span>🍯</span><div><b>Sticky</b>: stays exactly where it lands. Still merges.</div></li>
<li><span>💧</span><div><b>Slippery</b>: slides and bounces all over the place.</div></li>
<li><span>💣</span><div><b>Boom</b>: blows up the fruit touching it a moment after it lands. Big fruit just shrink a size.</div></li>
<li><span>🧲</span><div><b>Magnet</b>: pulls matching fruit towards it so they merge.</div></li>
<li><span>🧊</span><div><b>Frozen</b>: freezes the fruit it touches. When the ice cracks they shrink one size and lose any mould.</div></li>
<li><span>🦠</span><div><b>Mould</b>: the six smallest fruits go mouldy if left on the bottom too long, and then can't merge. Bigger fruit never goes mouldy.</div></li>
<li><span>🐛</span><div><b>Caterpillar</b>: visits every minute or so. It loves mouldy fruit (+25). No mould? It eats one of your small fruits. Every 3rd meal it turns into a butterfly (+150).</div></li></ul>
<h4>Coins &amp; powers</h4><p style="font-size:14px">Merges earn coins, bigger merges earn more. Spend them on powers below the jar. Each power needs a short rest before you can use it again.</p><ul class="wl">
<li><span>🔀</span><div><b>Swap</b> (5 coins, 5s cooldown): swap your fruit with the next one.</div></li>
<li><span>🌀</span><div><b>Shake</b> (12 coins, 15s cooldown): jolt the jar to shuffle the pile.</div></li>
<li><span>🌪️</span><div><b>Whirlpool</b> (15 coins, 18s cooldown): the pile swirls around the jar, then drops into new spots.</div></li>
<li><span>📳</span><div><b>Rumble</b> (10 coins, 15s cooldown): the jar vibrates for 3 seconds so the pile jiggles and settles tighter.</div></li></ul>
<button class="go wild" data-a="play" data-m="wild">Play Wild</button><button class="go alt" data-a="menu">Back</button>`)}
function showScores(m=G.mode){G.tab=m;if(G.state==='rogue')$('#pauseB').hidden=true;const w=LB&&G.scope==='world',n=SC[m].length;const el=show(`<h3>Leaderboard</h3><div class="tabs"><button data-a="tab" data-m="classic" class="${m==='classic'?'on':''}">Classic</button><button data-a="tab" data-m="wild" class="${m==='wild'?'on':''}">Wild</button><button data-a="tab" data-m="rogue" class="${m==='rogue'?'on':''}">Rogue</button></div>${LB?`<div class="tabs"><button data-a="scope" data-s="world" class="${w?'on':''}">🌍 World</button><button data-a="scope" data-s="local" class="${w?'':'on'}">📱 This device</button></div>`:''}${w?'<div id="bd"></div>':table(m)}<button class="go${GOC[m]}" data-a="play" data-m="${m}">Play ${MNAME[m]}</button><button class="go alt" data-a="${{pause:'paused',rogue:'rback'}[G.lbFrom]||'menu'}">Back</button>${n&&!w?`<br><button class="go lnk" data-a="reset">Clear ${MNAME[m]} scores</button>`:''}`);if(w)worldBoard(el.querySelector('#bd'),m,lastName)}
function play(mode=G.mode){if(mode==='rogue')return rgIntro();RUN=null;G.mode=mode;store.set('mode',mode);setBest();rgTitle(mode==='wild'?'🐛 Wild Merge':'🍉 Fruit Merge');hide();FLOAT.length=0;G.g=null;pw.hidden=mode!=='wild';G.pwKey='';G.lastCoins=0;fit();G.W=G.cssW;G.H=G.cssH;fit();G.g=makeGame(G.W,G.H,mode==='wild',gameOver);G.state='play';G.last=0;$('#pauseB').hidden=false;}
function pause(){if(G.state!=='play')return;G.state='pause';$('#pauseB').hidden=true;pauseMsg()}
function pauseMsg(){show(G.mode==='rogue'&&RUN?'<h3>Paused</h3><button class="go" data-a="resume">Keep playing</button><button class="go alt" data-a="rinfo">Run info</button><br><button class="go lnk" data-a="rquit">Abandon run</button>':'<h3>Paused</h3><button class="go" data-a="resume">Keep playing</button><button class="go alt" data-a="quit">Quit</button>')}
function gameOver(s){G.state='over';$('#pauseB').hidden=true;const m=G.mode,loc=qualifies(s,m);
 if(loc||(LB&&s>0&&!lastName)){snd(loc?'hi':'over');const rank=SC[m].filter(r=>r.s>=s).length+1;
  const el=show(`<div class="mode">${MNAME[m]}</div>${loc?`<span class="new">${rank===1?'New best!':'High score #'+rank}</span>`:''}${loc&&m!=='rogue'?'':ovH()}<div class="big">${s}</div><p>Put your name on the board:</p><form class="nm"><input id="nmI" maxlength="12" autocomplete="off" placeholder="Your name" value="${esc(lastName)}"><button class="go" type="submit">Save</button></form><button class="go alt" data-a="skip">Skip</button>`);
  const inp=el.querySelector('#nmI');setTimeout(()=>{try{inp.focus();inp.select()}catch(_){}},50);
  el.querySelector('form').onsubmit=e=>{e.preventDefault();const n=inp.value.trim().slice(0,12)||'Player';lastName=n;store.set('name',n);saveScore(n,s,m,loc)};
  G.pending=s;}
 else{snd('over');showOver(s,-1,LB&&s>0?lbSubmit(m,lastName,s):null)}}
function saveScore(n,s,m,loc=true){let hi=-1;if(loc){const rec={n,s,d:fmtD(Date.now()),t:Date.now()};SC[m].push(rec);SC[m].sort((a,b)=>b.s-a.s||a.t-b.t);SC[m]=SC[m].slice(0,MAXS);store.set(SKEY[m],SC[m]);setBest();hi=SC[m].indexOf(rec);}G.pending=null;showOver(s,hi,LB?lbSubmit(m,n,s):null)}
function showOver(s,hi,sub){const m=G.mode,w=!!LB;const el=show(`<div class="mode">${MNAME[m]}</div>${ovH()}<div class="big">${s}</div>${hi<0&&best()?`<p class="tg">Best: ${best()}</p>`:''}${w?`${hi>=0?`<p class="tg">#${hi+1} on this device</p>`:''}<h4>🌍 World top ${MAXS}</h4><div id="bd"></div>`:table(m,hi)}<button class="go${GOC[m]}" data-a="play" data-m="${m}">Play again</button><button class="go alt" data-a="menu">Menu</button>`);if(w)worldBoard(el.querySelector('#bd'),m,sub?lastName:null,sub)}

/* ---------- rogue mode: screens ---------- */
let RUN=null;
const cn=n=>`<u class="cn"><i class="coin"></i>${n}</u>`;
const jn=(R=RUN)=>`Depth ${R.depth}${R.depth>DEPTHS?' (endless)':''}`;
const chD=c=>CH[c.id].d+(CH[c.id].live?` <b>Now +${(c.v||0).toFixed(1)}.</b>`:'');
function rgTitle(s,ch){const t=$('#hd .t');t.textContent=s;t.classList.toggle('ch',!!ch);}
function rgHead(){rgTitle(RUN.ch.length?RUN.ch.map(c=>CH[c.id].e).join(''):'🎲 Rogue',1);}
function rgSave(){RUN.pile=G.g?G.g.snap():[];store.set('run',RUN);}
function rgBar(){const m=RG.score(RUN,0,{l:-1,combo:0,n:0,idle:1,jd:99,dl:99,jm:0,pu:0,high:false}).m;return `<p class="tg">Base Mult ×${m.toFixed(1)} · ${cn(RUN.coins)} · Run score ${RUN.total}</p>`;}
function rgIntro(){if(G.state!=='menu'||RUN)menu();G.mode='rogue';store.set('mode','rogue');setBest();const sv=store.get('run',null),ok=sv&&sv.v===1;
 const m=show(`<h3>Rogue run</h3><p>Go ${DEPTHS} depths down. Each depth is 3 jars, and the third is a <b>boss</b> with a nasty rule.</p><ul class="wl">
<li><span>🎯</span><div>Hit the jar's <b>score target</b> before your <b>drops</b> run out. Run dry or overflow and the run is over.</div></li>
<li><span>⚖️</span><div>The pile <b>carries over</b> from jar to jar. It is emptied at each new depth.</div></li>
<li><span>🛒</span><div>Cleared jars pay coins. Spend them in the shop on <b>charms</b> (hold up to ${SLOTS}) and upgrades, or on powers mid-jar. Saved coins earn interest.</div></li>
<li><span>✖️</span><div>A merge scores its points times your <b>Mult</b>. Charms push both up.</div></li></ul>
<canvas id="chain"></canvas><p style="font-size:13px;color:var(--muted);margin:0">Fruit sizes, as charms and bosses call them.</p>
${ok?`<button class="go rogue" data-a="rcont">Continue (${jn(sv)}, jar ${sv.jar+1})</button><br>`:''}<button class="go${ok?' alt':' rogue'}" data-a="rnew">New run</button><button class="go alt" data-a="menu">Back</button>`);chain(m,1);}
function rgStart(R){RUN=R;G.mode='rogue';store.set('mode','rogue');setBest();hide();FLOAT.length=0;G.g=null;pw.hidden=false;G.pwKey='';G.lastCoins=R.coins;G.over=null;fit();G.W=G.cssW;G.H=G.cssH;fit();
 G.g=makeGame(G.W,G.H,false,null,RG.ro(R,rgClear,rgEnd));if(R.pile&&R.pile.length)G.g.load(R.pile);G.last=0;if(R.at==='shop'&&R.shop)rgShop();else rgHub();}
function rgHub(){G.state='rogue';$('#pauseB').hidden=true;RUN.at='hub';if(RUN.jar===0)G.g.wipe();rgSave();rgHead();let h='';
 for(let j=0;j<3;j++){const c=RG.jarCfg(RUN,j),b=c.boss&&BOSS[c.boss];h+=`<li class="${j<RUN.jar?'done':j===RUN.jar?'cur':''}"><span>${j<RUN.jar?'✅':b?b.e:j+1}</span><div><b>${b?'Boss: '+b.n:'Jar '+(j+1)}</b><br>${b?b.d+'<br>':''}Score ${c.quota} in ${c.drops} drops</div><em><i class="coin"></i>${c.pay}</em></li>`;}
 show(`<div class="mode">Rogue run</div><h3>${jn()}</h3><ul class="wl">${h}</ul>${rgBar()}<button class="go rogue" data-a="rgo">Start jar</button><br><button class="go alt sm" data-a="rinfo">Run info</button><button class="go alt sm" data-a="menu">Save &amp; quit</button>`);}
function rgInfo(){const nb=BOSS[RG.boss(RUN)],ups=Object.keys(UPG).filter(k=>k!=='scrub'&&RUN.up[k]).map(k=>`${UPG[k].e} ${UPG[k].n} ×${RUN.up[k]}`).join(' · ');
 show(`<div class="mode">${jn()} · jar ${RUN.jar+1} of 3</div><h3>Run info</h3>${rgBar()}<h4>Charms (${RUN.ch.length}/${SLOTS})</h4>${RUN.ch.length?`<ul class="wl">${RUN.ch.map(c=>`<li><span>${CH[c.id].e}</span><div><b>${CH[c.id].n}</b>: ${chD(c)}</div></li>`).join('')}</ul>`:'<p class="none">None yet. Buy some in the shop.</p>'}${ups?`<h4>Upgrades</h4><p>${ups}</p>`:''}<h4>This depth's boss</h4><ul class="wl"><li><span>${nb.e}</span><div><b>${nb.n}</b>: ${nb.d}</div></li></ul><button class="go alt" data-a="${G.state==='pause'?'paused':'rback'}">Back</button>`);}
function rgGo(){const c=RG.jarCfg(RUN);RUN.cfg=c;hide();FLOAT.length=0;G.g.jar(c);G.state='play';G.last=0;$('#pauseB').hidden=false;}
function rgClear(left){const c=RUN.cfg,rows=RG.payout(RUN,c,left),was=`${jn()} · ${c.boss?BOSS[c.boss].n:'Jar '+(RUN.jar+1)}`;let sum=0;for(const r of rows)sum+=r[1];
 const win=RG.advance(RUN,sum);G.state='rogue';$('#pauseB').hidden=true;rgSave();
 const pay=`<ul class="wl">${rows.map(r=>`<li><div>${r[0]}</div><em><i class="coin"></i>+${r[1]}</em></li>`).join('')}<li><div><b>Total</b></div><em><i class="coin"></i>+${sum}</em></li></ul>`;
 if(win){snd('hi');show(`<div class="mode">${was}</div><h3>You win!</h3><p>The Melon King is juice. Run score:</p><div class="big">${RUN.total}</div>${pay}<p>Bank this score, or go deeper for a bigger one.</p><button class="go rogue" data-a="rshop">Go deeper</button><button class="go alt" data-a="rbank">Bank score</button>`);}
 else show(`<div class="mode">${was}</div><h3>Jar cleared!</h3>${pay}<p class="tg">You now have ${cn(RUN.coins)}</p><button class="go rogue" data-a="rshop">Shop</button>`);}
function rgShop(keep){G.state='rogue';$('#pauseB').hidden=true;RUN.at='shop';rgSave();rgHead();const S=RUN.shop,full=RUN.ch.length>=SLOTS,rr=RG.cost(RUN,2+S.rr),old=ui.querySelector('.msg'),sy=keep&&old?old.scrollTop:0;
 const nx=RG.jarCfg(RUN),it=S.ch.map((id,i)=>{if(!id)return'';const d=CH[id],p=RG.cost(RUN,d.c);return `<li><span>${d.e}</span><div><b>${d.n}</b> <small class="r${d.r}">${RAR[d.r]}</small><br>${d.d}</div><button class="go sm" data-a="rbuy" data-i="${i}"${full||RUN.coins<p?' disabled':''}>${full?'Full':'<i class="coin"></i>'+p}</button></li>`}).join('');
 const up=S.up.map((id,i)=>{if(!id)return'';const d=UPG[id],p=RG.upCost(RUN,id);return `<li><span>${d.e}</span><div><b>${d.n}</b> <small>Upgrade</small><br>${d.d}</div><button class="go sm" data-a="rup" data-i="${i}"${RUN.coins<p?' disabled':''}><i class="coin"></i>${p}</button></li>`}).join('');
 const own=RUN.ch.length?`<ul class="wl">${RUN.ch.map((c,i)=>`<li><span>${CH[c.id].e}</span><div><b>${CH[c.id].n}</b>: ${chD(c)}</div><button class="go alt sm" data-a="rsell" data-i="${i}">Sell <i class="coin"></i>${Math.floor(CH[c.id].c/2)}</button></li>`).join('')}</ul>`:'<p class="none">None yet.</p>';
 const m=show(`<div class="mode">${jn()} · next: ${nx.boss?BOSS[nx.boss].n:'jar '+(RUN.jar+1)}</div><h3>Shop</h3><p class="tg">You have ${cn(RUN.coins)}</p>${it||up?`<ul class="wl">${it}${up}</ul>`:'<p class="none">Sold out.</p>'}<button class="go alt sm" data-a="rroll"${RUN.coins<rr?' disabled':''}>Reroll <i class="coin"></i>${rr}</button><h4>Your charms (${RUN.ch.length}/${SLOTS})</h4>${own}<button class="go rogue" data-a="rhub">Continue</button>`);m.scrollTop=sy;}
function rgEnd(why){G.over={why,d:RUN.depth,j:RUN.jar};store.set('run',null);gameOver(RUN.total);}
function ovH(){const o=G.over;if(G.mode!=='rogue'||!o)return '<h3>Game over!</h3>';if(o.why==='win')return `<h3>Run complete!</h3><p class="tg">You beat ${o.d>DEPTHS+1?o.d-1:'all '+DEPTHS} depths.</p>`;
 return `<h3>Run over!</h3><p class="tg">${o.why==='over'?'The pile overflowed':o.why==='drops'?'Out of drops':'Ended'} on depth ${o.d}, ${o.j===2?'the boss':'jar '+(o.j+1)}.</p>`;}
function rgAct(a,b){const i=+b.dataset.i,sure=t=>{if(b.dataset.sure)return true;b.dataset.sure=1;b.textContent=t;return false;};
 if(a==='rogue')rgIntro();
 else if(a==='rnew'){if(!store.get('run',null)||sure('Tap again to drop your saved run'))rgStart(RG.new());}
 else if(a==='rcont'){const sv=store.get('run',null);if(sv&&sv.v===1)rgStart(sv);else rgIntro();}
 else if(!RUN||a[0]!=='r')return false;
 else if(a==='rgo')rgGo();else if(a==='rhub')rgHub();else if(a==='rshop')rgShop();else if(a==='rinfo')rgInfo();else if(a==='rback'){if(RUN.at==='shop')rgShop();else rgHub();}
 else if(a==='rbank')rgEnd('win');
 else if(a==='rquit'){if(sure('Tap again to end the run'))rgEnd('quit');}
 else if(a==='rbuy'){if(RG.buy(RUN,i)){snd('coin');rgShop(1);}}
 else if(a==='rup'){const id=RG.buyUp(RUN,i);if(id){if(id==='scrub')G.g.scrub();snd('coin');rgShop(1);}}
 else if(a==='rsell'){if(sure('Sure?')&&RG.sell(RUN,i)){snd('coin');rgShop(1);}}
 else if(a==='rroll'){if(RG.reroll(RUN)){snd('swap');rgShop(1);}}
 else return false;
 return true;}
$('#hd .t').onclick=()=>{if(G.mode!=='rogue'||!RUN)return;if(G.state==='play')pause();if(G.state==='pause'){snd('ui');rgInfo();}};

ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;snd('ui');if(rgAct(a,b))return;
 if(a==='play')play(b.dataset.m||G.mode);else if(a==='scores'){G.lbFrom='menu';showScores()}else if(a==='paused')pauseMsg();else if(a==='tab')showScores(b.dataset.m);else if(a==='scope'){G.scope=b.dataset.s;showScores(G.tab||G.mode)}else if(a==='wildinfo')wildInfo();else if(a==='install')install();else if(a==='menu'||a==='quit')menu();
 else if(a==='resume'){hide();G.state='play';G.last=0;$('#pauseB').hidden=false}
 else if(a==='skip')showOver(G.pending,-1);
 else if(a==='reset'){const m=G.tab||G.mode;if(b.dataset.sure){SC[m]=[];store.set(SKEY[m],[]);setBest();showScores(m)}else{b.dataset.sure=1;b.textContent='Tap again to clear '+MNAME[m]+' scores'}}});
$('#pauseB').onclick=pause;
/* ---------- install to home screen ---------- */
let instPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBtn(){return !standalone()&&(instPrompt||matchMedia('(pointer:coarse)').matches)?'<button class="go alt sm" data-a="install">📲 Install app</button>':''}
function syncInstall(){const s=$('#instSlot');if(s)s.innerHTML=installBtn()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instPrompt=e;syncInstall()});
window.addEventListener('appinstalled',()=>{instPrompt=null;syncInstall()});
function install(){if(instPrompt){const p=instPrompt;instPrompt=null;p.prompt();(p.userChoice||Promise.resolve()).finally(syncInstall);return}
 show(`<h3>Install</h3><p>Put Fruit Merge on your home screen. It opens full screen like an app.</p>${isIOS
  ?'<ol class="wl"><li><span>1</span><div>Tap <b>Share</b> (the square with an arrow). In Safari it is at the bottom, in Chrome it is in the address bar.</div></li><li><span>2</span><div>Scroll down and tap <b>Add to Home Screen</b>.</div></li><li><span>3</span><div>Tap <b>Add</b>.</div></li></ol>'
  :'<ol class="wl"><li><span>1</span><div>Open your browser menu (<b>⋮</b> or <b>☰</b>).</div></li><li><span>2</span><div>Tap <b>Install app</b> or <b>Add to Home screen</b>.</div></li></ol>'}<button class="go alt" data-a="menu">Back</button>`)}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
$('#lbB').onclick=()=>{if(G.state==='over'&&G.pending!=null)return;snd('ui');if(G.state==='play')pause();G.lbFrom=G.state==='pause'?'pause':G.state==='rogue'&&RUN?'rogue':'menu';showScores()};
function setSnd(){$('#sndB').textContent=sndOn?'🔊':'🔇';$('#sndB').setAttribute('aria-pressed',sndOn)}
$('#sndB').onclick=()=>{sndOn=!sndOn;store.set('snd2',sndOn);setSnd();snd('ui')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.addEventListener('resize',()=>{fit();if(G.state==='menu')menu()});
setSnd();setBest();menu();G.raf=requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(G.state==='menu')menu()});
</script>
</body></html>
