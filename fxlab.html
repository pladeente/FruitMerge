<style>
/* Layout: one column of jar cards on a phone, a grid on wider screens; the game's own dark world, single theme on purpose */
:root{--bg:#120a1f;--panel:#2a1a3a;--line:#3d2a52;--cream:#fff2d8;--dim:#c9c3d4;--brass:#f4bb4a;--teal:#35c2b4;--pink:#ff4d8d;--display:'Jersey 15',ui-monospace,monospace;color-scheme:dark}
body{background:var(--bg);color:var(--cream);font:17px/1.3 var(--display);letter-spacing:.2px}
.wrap{max-width:1260px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:40px;line-height:1;margin:0;color:var(--brass);font-weight:400;text-wrap:balance}
.sub{color:var(--dim);max-width:62ch;margin:8px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 20px}
button{font:inherit;font-size:16px;color:var(--cream);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--teal)}button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#1b1029}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hd{display:flex;align-items:center;gap:8px}
.hd canvas.ic{width:30px;height:30px;image-rendering:pixelated;flex:none}
.nm{font-size:22px;flex:1;min-width:0}
.chip{font-size:14px;padding:1px 8px;border-radius:6px;background:#1b1029;color:var(--dim);white-space:nowrap}
.chip.live{background:var(--teal);color:#1b1029}.chip.hit{background:var(--pink);color:#fff}
canvas.jar{width:100%;max-width:100%;aspect-ratio:388/725;border-radius:8px;background:#1b1029;display:block}
.tx{font-size:15px;color:var(--dim);margin:0}
.tx b{color:var(--cream);font-weight:400}
.row{display:flex;gap:6px}
.lbl{color:var(--dim);font-size:15px;margin-right:2px}
.bar button .n{color:var(--dim);margin-left:4px}.bar button[aria-pressed="true"] .n{color:#1b1029}
.ver{font-size:13px;color:var(--dim)}
.card[hidden]{display:none}
</style>
<div class="wrap">
<h1>Charm scenes</h1>
<p class="sub">Each charm plays its own scene in the jar while it is working, so you can see your build without reading the header. Every card loops a short script: the charm held but idle, its condition coming true, then merges it scores on.</p>
<div class="bar"><button id="slow" aria-pressed="false">Slow motion</button><button id="pause" aria-pressed="false">Pause</button><button id="all">Replay all</button></div>
<div class="bar" id="filt" role="toolbar" aria-label="Show"></div>
<div class="bar" id="sort" role="toolbar" aria-label="Sort"></div>
<div class="grid" id="grid"></div>
</div>

<script src="rogue.js"></script>
<script src="core.js"></script>

const geo=()=>({L,R,top:TOP,bot:BOT,W,H,K,P,hy:HY}),rd=l=>FRUIT[l][1]*W;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* a settled pile: fruit dropped one by one and pushed apart until they rest */
function pile(seed,sizes,until){const r=rng(seed),fr=[];let k=0;const step=()=>{for(let it=0;it<3;it++){for(const f of fr){f.y=Math.min(BOT-f.r,f.y+2);f.x=Math.max(L+f.r,Math.min(R-f.r,f.x));}for(let i=0;i<fr.length;i++)for(let j=i+1;j<fr.length;j++){const a=fr[i],b=fr[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,o=a.r+b.r-d;if(o>0){const ma=a.r*a.r,mb=b.r*b.r,s=o/(ma+mb);a.x-=dx/d*s*mb;a.y-=dy/d*s*mb;b.x+=dx/d*s*ma;b.y+=dy/d*s*ma;}}}};
 const addOne=l=>{const rr=rd(l);fr.push({l,r:rr,x:L+rr+r()*(R-L-2*rr),y:TOP-rr});for(let s=0;s<160;s++)step();};
 if(until){while(k<60){addOne(sizes[k%sizes.length]);k++;if(Math.min(...fr.map(f=>f.y-f.r))<until)break;}}else for(const l of sizes)addOne(l);for(let s=0;s<200;s++)step();return fr;}
function landY(fr,x,r){let y=BOT-r;for(const f of fr){const dx=Math.abs(f.x-x),s=f.r+r;if(dx<s)y=Math.min(y,f.y-Math.sqrt(s*s-dx*dx));}return y;}

const KIND={boss:'Bosses',zone:'Charms in the jar',merge:'Merge styles',grow:'Growing',fusion:'Fusions'},META={};
for(const id of['wire','brink','tidy','crew','fright','lime','early','clutch','enc'])META[id]=['zone','1.75'];META.bon=['zone','1.75'];for(const id of['oak','tiki','snow'])META[id]=['grow','1.75'];
for(const id of['low','fshow','hot','slow','cstage','wall'])META[id]=['zone','1.76'];for(const id of['comic','juicer','heavy','snake','dnoth'])META[id]=['merge','1.76'];
META.knock=['merge','1.77'];META.magpie=['zone','1.77'];for(const id of['ivy','still','amph','wildfire','enc2'])META[id]=['fusion','1.77'];for(const id of['btax','bstorm','bice','bthief','bmelon'])META[id]=['boss','1.78'];
D.forEach((d,i)=>{const m=META[d.id]||['zone','1.75'];d.kind=m[0];d.v=m[1];d.i=i;});
let SLOW=0,PAUSE=0;const cards=[];let SHOW='all',SORT='new';try{SHOW=localStorage.getItem('fxShow')||'all';SORT=localStorage.getItem('fxSort')||'new';}catch(e){}
function bars(){const f=document.getElementById('filt'),o=document.getElementById('sort'),cnt=k=>D.filter(d=>k==='all'||d.kind===k).length;
 f.innerHTML='<span class="lbl">Show</span>'+[['all','All'],...Object.entries(KIND)].map(([k,n])=>`<button data-k="${k}" aria-pressed="${SHOW===k}">${n}<span class="n">${cnt(k)}</span></button>`).join('');
 o.innerHTML='<span class="lbl">Sort</span>'+[['new','Newest first'],['old','Oldest first'],['az','A to Z']].map(([k,n])=>`<button data-s="${k}" aria-pressed="${SORT===k}">${n}</button>`).join('');
 f.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;SHOW=b.dataset.k;try{localStorage.setItem('fxShow',SHOW);}catch(x){}bars();lay();};
 o.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;SORT=b.dataset.s;try{localStorage.setItem('fxSort',SORT);}catch(x){}bars();lay();};}
/* order and hide the cards; newest first by default so new work is at the top */
function lay(){const g=document.getElementById('grid'),vn=v=>v.split('.').map(Number).reduce((a,n)=>a*100+n,0),nm=c=>c.el.querySelector('.nm').textContent;
 const o=cards.slice().sort((a,b)=>SORT==='az'?nm(a).localeCompare(nm(b)):SORT==='old'?vn(a.d.v)-vn(b.d.v)||a.d.i-b.d.i:vn(b.d.v)-vn(a.d.v)||a.d.i-b.d.i);
 for(const c of o){c.el.hidden=!(SHOW==='all'||c.d.kind===SHOW);g.appendChild(c.el);if(!c.el.hidden)reset(c);}}
function drop(c,x,l,id,ex){const r=rd(l);c.fall={x,y:TOP-r-6,vy:0,l,r,ty:landY(c.fr,x,r),id,ex};c.fx.ev('drop',{x});c.lastD=c.t;}
/* a merge on a fruit already in the pile: the one nearest the spot (fx, fy as shares of the jar), with no drop */
function mg(c,fx,fy,id,ex){let b=null,bd=1e9;const tx=L+(R-L)*fx,ty=TOP+(BOT-TOP)*fy;for(const f of c.fr){const d=Math.hypot(f.x-tx,f.y-ty);if(d<bd){bd=d;b=f;}}c.pops.push({x:b.x,y:b.y,r:b.r,t:0});c.fx.hit(id,Object.assign({x:b.x,y:b.y,l:b.l,r:b.r},ex||{}));c.hitT=.6;}
function reset(c){if(c.fr)c.fr.forEach(f=>f.gold=0);c.t=0;c.fx=fxNew();c.v=0;c.fall=null;c.pops=[];c.tg=null;c.ei=0;c.hitT=0;}
function build(){const g=document.getElementById('grid');for(const d of D){const el=document.createElement('div');el.className='card';const nm=d.boss||(CH[d.ch]||{}).n||d.ch;el.dataset.id=d.id;el.innerHTML=`<div class="hd"><canvas class="ic" width="12" height="12"></canvas><div class="nm">${nm}</div><span class="ver">v${d.v}</span><span class="chip">Waiting</span></div><canvas class="jar"></canvas><p class="tx">${d.tx}</p><div class="row"><button>Replay</button></div>`;g.appendChild(el);
 const ic=el.querySelector('.ic'),ik=(typeof ICN!=='undefined'&&ICN[d.ch])||d.ch,gk=PXD[ik]?ik:null;if(gk)ic.getContext('2d').drawImage(fxGrid(PXD[gk],PXP),0,0);else ic.remove();
 const cv=el.querySelector('canvas.jar'),dp=Math.min(2,devicePixelRatio||1);cv.width=W*dp;cv.height=H*dp;const c={d,el,cv,ctx:cv.getContext('2d'),dp,chip:el.querySelector('.chip'),fr:d.pile(),vis:true};reset(c);el.querySelector('button').onclick=()=>reset(c);cards.push(c);}
 const io=new IntersectionObserver(es=>{for(const e of es){const c=cards.find(k=>k.cv===e.target);if(c)c.vis=e.isIntersecting;}});cards.forEach(c=>io.observe(c.cv));}
function frame(c,dt){const d=c.d;if(!PAUSE){c.t+=dt;if(c.t>=d.dur)reset(c);while(c.ei<d.ev.length&&c.t>=d.ev[c.ei][0]){d.ev[c.ei][1](c);c.ei++;}
  if(c.fall){const f=c.fall;f.vy+=1100*dt;f.y+=f.vy*dt;if(f.y>=f.ty){f.y=f.ty;c.pops.push({x:f.x,y:f.y,r:f.r,t:0});if(/g$/.test(f.id))c.fx.ev('grow',{id:f.id.slice(0,-1),x:f.x,y:f.y});else c.fx.hit(f.id,Object.assign({x:f.x,y:f.y,l:f.l,r:f.r},f.ex||{}));c.hitT=.6;c.last={x:f.x,y:f.y,r:f.r};c.fall=null;}}
  c.tg=c.fall?{tx:c.fall.x,ty:c.fall.y,tr:c.fall.r}:c.last?{tx:c.last.x,ty:c.last.y,tr:c.last.r}:{tx:W*.5,ty:TOP+40,tr:20};
  const lv=d.lv(c.t,c);c.fx.tick(dt,geo(),lv);c.hitT-=dt;for(const p of c.pops)p.t+=dt;c.pops=c.pops.filter(p=>p.t<.9);
  const on=Object.values(lv).some(o=>o.on&&(o.n==null||o.n>0)&&o.v==null);c.chip.textContent=d.boss?(c.t<1.5?'Arrives':(Object.values(lv)[0].done?'Beaten':Object.values(lv)[0].ph>1?'Phase 2':'Phase 1')):c.hitT>0?'Scored':on?'Live':d.id==='oak'||d.id==='tiki'||d.id==='snow'?'Growing':'Waiting';c.chip.className='chip'+(c.hitT>0?' hit':on?' live':'');}
 const x=c.ctx,g=geo();x.setTransform(c.dp,0,0,c.dp,0,0);x.clearRect(0,0,W,H);drawBg(x,W,H,c.t,TOP);drawJar(x,L,R,TOP,BOT,c.t);x.strokeStyle='#ff8fab';x.setLineDash([8,6]);x.lineWidth=2;x.beginPath();x.moveTo(L,TOP);x.lineTo(R,TOP);x.stroke();x.setLineDash([]);
 c.fx.back(x,g);for(const f of c.fr){drawFruit(x,f.x,f.y,f.r,f.l);if(f.gold){x.strokeStyle='#ffc61a';x.lineWidth=3;x.beginPath();x.arc(f.x,f.y,f.r+1,0,7);x.stroke();}}if(c.fall)drawFruit(x,c.fall.x,c.fall.y,c.fall.r,c.fall.l);
 c.fx.front(x,g);if(!c.fall){const r=rd(1);drawFruit(x,W/2,TOP-r-6,r,1);}hud(x);
 for(const p of c.pops){const u=p.t/.9;x.globalAlpha=Math.max(0,1-u*1.6);x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(p.x,p.y,p.r*(1+u*1.2),0,7);x.stroke();x.globalAlpha=Math.max(0,1-Math.max(0,u-.5)*2);if(d.x)T(x,d.x,p.x,p.y-p.r-10-u*26,22,'#7a2fe0','center',FD);x.globalAlpha=1;}}
/* the in-jar HUD as the game draws it, so the scenes can be judged against it */
function hud(x){x.fillStyle='#fff3e6dd';rr(x,6,6,84,40,10);x.fill();T(x,'Depth 3',14,19,12,'#3b2346aa','left');T(x,'Jar 2/3',14,36,13,'#3b2346','left');x.fillStyle='#fff3e6dd';rr(x,W/2-68,6,136,52,12);x.fill();T(x,'1240',W/2-30,26,24,'#3b2346','left',FD);T(x,'/ 2100',W/2+22,29,13,'#3b2346aa','left');x.fillStyle='#3b234626';rr(x,W/2-59,40,118,7,3.5);x.fill();x.fillStyle='#ff4d8d';rr(x,W/2-59,40,70,7,3.5);x.fill();x.fillStyle='#fff3e6dd';rr(x,W-90,6,84,94,12);x.fill();T(x,'Mult ×6.5',W-48,22,15,'#7a2fe0','center',FB,900);T(x,'Next',W-66,55,13,'#3b2346aa');drawFruit(x,W-27,54,13,2);}
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0)*(SLOW?.35:1);last=ts;for(const c of cards)if(c.vis)frame(c,dt);requestAnimationFrame(loop);}
document.getElementById('slow').onclick=e=>{SLOW^=1;e.target.setAttribute('aria-pressed',!!SLOW);};document.getElementById('pause').onclick=e=>{PAUSE^=1;e.target.setAttribute('aria-pressed',!!PAUSE);};document.getElementById('all').onclick=()=>cards.forEach(reset);
if(typeof frIcons!=="function")window.frIcons=()=>{};if(typeof cosIcons!=="function")window.cosIcons=()=>{};
artLoad();build();bars();lay();requestAnimationFrame(loop);
</script>
